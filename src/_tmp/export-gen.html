    t_replace: svgI('<path d="M20.5 12a8.5 8.5 0 1 1-2.7-6.2"/><path d="M20.5 3.5V9h-5.5"/>', 1.9)
  };

  var ICON_BY_TOOL = {
    select: ICONS.t_select, rect: ICONS.t_rect, ellipse: ICONS.t_ellipse,
    arrow: ICONS.t_arrow, pen: ICONS.t_pen, highlight: ICONS.t_highlight, pin: ICONS.t_pin
  };

  /* 批注类型定义 */
  var TYPES = [
    { key: 'typo',    label: '错别字', short: '错字', color: 'var(--c-typo)',    dot: '#FF3B30' },
    { key: 'wording', label: '措辞',   short: '措辞', color: 'var(--c-wording)', dot: '#FF9500' },
    { key: 'format',  label: '格式',   short: '格式', color: 'var(--c-format)',  dot: '#AF52DE' },
    { key: 'emoji',   label: '表情',   short: '表情', color: 'var(--c-emoji)',   dot: '#32ADE6' },
    { key: 'praise',  label: '赞赏',   short: '赞赏', color: 'var(--c-praise)',  dot: '#34C759' },
    { key: 'general', label: '整体',   short: '整体', color: 'var(--c-general)', dot: '#8E8E93' }
  ];
  var TYPE_MAP = {};
  TYPES.forEach(function (t) { TYPE_MAP[t.key] = t; });
  var TYPE_ORDER = TYPES.map(function (t) { return t.key; });

  /* 常用话术模板 */
  var TEMPLATES = [
    '时间表述建议统一为 24 小时制，如「19:00」。',
    '建议补充活动时间、地点、参与方式。',
    '此处建议单独成行，与上下段拉开层级。',
    '学院名称请使用全称「智慧农业学院（人工智能学院）」。',
    '建议删去口语化表达，改成书面语。',
    '表情位置合适，保留。',
    '通读一遍，语序稍作调整会更顺。'
  ];

  /* ============================================================
   * 3. Lexer —— 原文 → Token 数组（每个 Token 携带 raw 偏移）
   * ============================================================ */
  var EMOJI_SRC = '(?:\\p{Emoji_Presentation}|\\p{Extended_Pictographic}\\uFE0F)' +
                  '(?:\\uFE0F|\\u20E3|\\u200D\\p{Extended_Pictographic}\\uFE0F?)*';

  /* 用映射表反向构建正则，而不是去猜 [\u4e00-\u9fa5]{1,6} 这样的宽泛范围。
     宽泛范围的致命问题：正则贪婪，遇到「/呲牙学院见」会一口吞下「呲牙学院见」，
     查表失败后整段失效；遇到「[重要]」又会误判。改成精确枚举后，只有真的
     是表情名才会命中。按长度降序排列，保证「左太极」优先于更短的候选。 */
  var NAME_ALT = Object.keys(EMOJI_BY_NAME)
    .sort(function (a, b) { return b.length - a.length; })
    .map(function (n) { return n.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); })
    .join('|');

  /* 斜杠形式后面若紧跟中文/字母/数字，说明它更可能是「优点/弱点」这类普通文本，
     不是一个表情代码，故用后向断言挡掉。宁可少认一个表情，也不能篡改正文。 */
  var TOKEN_RE = new RegExp(
    '\\[\\/?em\\]e(\\d{1,4})\\[\\/em\\]' +                          // 1: em 标签
    '|\\/(' + NAME_ALT + ')(?![\\u4e00-\\u9fa5A-Za-z0-9])' +        // 2: 斜杠代码
    '|\\[(' + NAME_ALT + ')\\]' +                                    // 3: 中括号
    '|(' + EMOJI_SRC + ')',                                          // 4: Unicode emoji
    'gu'
  );

  /**
   * 把原文切成 Token 序列。
   * 关键：中括号 / 斜杠形式的候选内容 **必须命中映射表** 才认定为表情，
   *       否则 [重要]、3/4、[1] 这类会被误替换。
   */
  function lex(raw) {
    var tokens = [];
    var last = 0;
    var m;
    TOKEN_RE.lastIndex = 0;

    while ((m = TOKEN_RE.exec(raw)) !== null) {
      var start = m.index;
      var end = start + m[0].length;
      var char = null;
      var name = '';

      if (m[1] !== undefined) {
        char = EMOJI_BY_CODE['e' + m[1]] || null;
        name = 'e' + m[1];
      } else if (m[2] !== undefined) {
        if (EMOJI_BY_NAME[m[2]]) { char = EMOJI_BY_NAME[m[2]]; name = m[2]; }
      } else if (m[3] !== undefined) {
        if (EMOJI_BY_NAME[m[3]]) { char = EMOJI_BY_NAME[m[3]]; name = m[3]; }
      } else if (m[4] !== undefined) {
        char = m[4];
        name = '';
      }

      if (char === null) {
        if (m[0].length === 0) TOKEN_RE.lastIndex++;
        continue; // 未命中映射表 → 当作普通文本，留给相邻文本 token
      }

      if (start > last) {
        tokens.push({ type: 'text', start: last, end: start });
      }
      tokens.push({ type: 'emoji', start: start, end: end, char: char, name: name });
      last = end;
    }

    if (last < raw.length) {
      tokens.push({ type: 'text', start: last, end: raw.length });
    }
    return tokens;
  }

  /**
   * 把偏移吸附到 Token 边界，避免批注把表情切成两半。
   *
   * 只对「表情」Token 生效！文本 Token 往往覆盖很长一段（整段连续文字），
   * 如果对文本也做吸附，任何选区都会被拉回片段边界，用户会发现
   * 无论选哪几个字，批注都盖住整段——这条曾真实踩过。
   */
  function snapToToken(tokens, pos, dir) {
    for (var i = 0; i < tokens.length; i++) {
      var t = tokens[i];
      if (t.type !== 'emoji') continue;
      if (pos > t.start && pos < t.end) {
        return dir > 0 ? t.end : t.start;
      }
    }
    return pos;
  }

  /* ============================================================
   * 4. 批注锚定引擎 —— 区间切分 + 渲染计划
   * ============================================================ */

  /**
   * 把原文按「Token 边界 ∪ 批注边界」切成互不重叠的原子片段，
   * 每个片段记录它被哪些批注覆盖。
   */
  function buildRenderPlan(raw, tokens, anns, from, to) {
    var lo = (from === undefined) ? 0 : from;
    var hi = (to === undefined) ? raw.length : to;

    var ptsSet = Object.create(null);
    ptsSet[lo] = 1; ptsSet[hi] = 1;
    tokens.forEach(function (t) {
      if (t.start >= lo && t.start <= hi) ptsSet[t.start] = 1;
      if (t.end >= lo && t.end <= hi) ptsSet[t.end] = 1;
    });
    anns.forEach(function (a) {
      if (a.start >= lo && a.start <= hi) ptsSet[a.start] = 1;
      if (a.end >= lo && a.end <= hi) ptsSet[a.end] = 1;
    });

    var pts = Object.keys(ptsSet).map(Number).sort(function (a, b) { return a - b; });
    var plan = [];
    var ti = 0;

    for (var i = 0; i < pts.length - 1; i++) {
      var s = pts[i], e = pts[i + 1];
      if (s >= e) continue;

      while (ti < tokens.length && tokens[ti].end <= s) ti++;
      var tok = tokens[ti];
      var isEmoji = !!(tok && tok.type === 'emoji' && tok.start <= s && tok.end >= e);

      var covers = [];
      for (var j = 0; j < anns.length; j++) {
        var a = anns[j];
        if (a.start <= s && a.end >= e && a.start < a.end) covers.push(a.id);
      }

      plan.push({
        start: s,
        end: e,
        text: raw.slice(s, e),
        emoji: isEmoji ? tok.char : null,
        emojiName: isEmoji ? tok.name : '',
        covers: covers
      });
    }
    return plan;
  }

  /** 多重覆盖时按类型优先级选一个主色 */
  function dominantAnn(covers, annMap) {
    for (var i = 0; i < TYPE_ORDER.length; i++) {
      for (var j = 0; j < covers.length; j++) {
        var a = annMap[covers[j]];
        if (a && a.type === TYPE_ORDER[i]) return a;
      }
    }
    return annMap[covers[0]] || null;
  }

  /* ============================================================
   * 5. 正文渲染
   * ============================================================ */
  function renderBody(raw, anns, opts) {
    opts = opts || {};
    var tokens = lex(raw);
    var annMap = {};
    anns.forEach(function (a) { annMap[a.id] = a; });
    var plan = buildRenderPlan(raw, tokens, anns);

    var frag = document.createDocumentFragment();
    plan.forEach(function (seg) {
      var el = document.createElement('span');
      el.dataset.s = seg.start;
      el.dataset.e = seg.end;

      if (seg.emoji) {
        el.className = 'qq-emoji';
        el.textContent = seg.emoji;
        if (seg.emojiName) el.title = '表情：' + seg.emojiName;
      } else {
        el.className = 'seg';
        el.textContent = seg.text;
      }

      if (seg.covers.length) {
        /* 用空格分隔：CSS 的 [data-ann~="id"] 只能匹配空格分隔的列表，
           用逗号会导致「点批注卡跳转到正文」这个反查彻底失效。 */
        el.dataset.ann = seg.covers.join(' ');
        var lost = seg.covers.some(function (id) { return annMap[id] && annMap[id].lost; });
        if (lost) el.classList.add('is-lost');
        if (!opts.noHighlight) {
          var dom = dominantAnn(seg.covers, annMap);
          if (dom) el.classList.add('hl', 'hl-' + dom.type);
          if (seg.covers.length > 1) el.classList.add('hl-multi');
        }
      }
      frag.appendChild(el);
    });
    return frag;
  }

  /* ============================================================
   * 6. 存储层
   * ============================================================ */
  var KEY_INDEX = 'qqpc:index';
  var KEY_DOC = 'qqpc:doc:';
  var KEY_SET = 'qqpc:settings';

  var store = {
    index: function () {
      try { return JSON.parse(localStorage.getItem(KEY_INDEX)) || []; }
      catch (e) { return []; }
    },
    setIndex: function (list) {
      try { localStorage.setItem(KEY_INDEX, JSON.stringify(list)); }
      catch (e) { toast('本地存储写入失败，建议导出 JSON 备份'); }
    },
    doc: function (id) {
      try { return JSON.parse(localStorage.getItem(KEY_DOC + id)); }
      catch (e) { return null; }
    },
    setDoc: function (doc) {
      try { localStorage.setItem(KEY_DOC + doc.id, JSON.stringify(doc)); return true; }
      catch (e) {
        toast('本地存储空间不足，请先导出 JSON 备份再清理旧文档');
        return false;
      }
    },
    removeDoc: function (id) { localStorage.removeItem(KEY_DOC + id); },
    settings: function () {
      try { return JSON.parse(localStorage.getItem(KEY_SET)) || {}; }
      catch (e) { return {}; }
    },
    setSettings: function (s) {
      try { localStorage.setItem(KEY_SET, JSON.stringify(s)); } catch (e) {}
    }
  };

  /* ============================================================
   * 7. 状态
   * ============================================================ */
  var STATE = {
    doc: null,
    mode: 'annotate',
    filter: 'all',
    pendingSel: null,
    focusAnnId: null,
    dirty: false          /* 有没有还没落盘的改动，见下方保存模型 */
  };

  /* ---------- 7.1 保存模型 ----------
   * 刻意不做「改一个字就自动落盘」。批改稿是有定稿语义的：
   * 如果每次输入都悄悄写进本地，用户根本分不清当前这版
   * 是不是发回给干事的版本。所以 STATE.dirty 是唯一真相，
   * 只有点「保存」或按 Ctrl+S 才真的写盘；带着未保存的改动
   * 切换文档 / 新建 / 关页面时一律先问一句。
   * ------------------------------------------------ */
  function markDirty() {
    if (!STATE.doc) return;
    STATE.doc.updatedAt = Date.now();
    setDirty(true);
  }
  /* 老代码里到处是 touch()，语义就是「有改动」，保留这个别名 */
  function touch() { markDirty(); }

  function setDirty(d) {
    STATE.dirty = !!d;
    setSaveHint(STATE.dirty);
    renderSaveBtn();
  }

  function setSaveHint(dirty) {
    var el = $('#saveHint');
    if (!el) return;
    el.textContent = dirty ? '未保存' : '已保存';
    el.classList.toggle('dirty', !!dirty);
  }

  function renderSaveBtn() {
    var b = $('#btnSave');
    if (!b) return;
    b.disabled = !STATE.dirty;
    b.title = STATE.dirty ? '保存（Ctrl + S）' : '没有需要保存的改动';
  }

  /* 唯一真正落盘的地方。silent=true 表示「切换文档时顺手保存」，不弹提示。*/
  function saveNow(silent) {
    if (!STATE.doc) return false;
    if (STATE.mode === 'edit' && STATE.doc.kind !== 'image') {
      STATE.doc.raw = $('#editor').value;
    }
    STATE.doc.updatedAt = Date.now();
    var ok = store.setDoc(STATE.doc);
    if (!ok) return false;            /* 配额不足，store 已经提示过，保持 dirty */
    syncIndexEntry();
    renderDocList();
    setDirty(false);
    if (!silent) toast('已保存');
    return true;
  }

  /* 有未保存改动时的守卫：next 是「确定要执行的动作」 */
  function guardUnsaved(next) {
    if (!STATE.doc || !STATE.dirty) { next(); return; }
    ask({
      title: '还有改动没保存',
      msg: '「' + (STATE.doc.title || '未命名推送') + '」有修改尚未保存。',
      actions: [
        { label: '保存', value: 'save', kind: 'primary' },
        { label: '不保存', value: 'discard', kind: 'destructive' },
        { label: '取消', value: 'cancel', kind: 'ghost' }
      ]
    }).then(function (r) {
      if (r.act === 'save') {
        if (saveNow(true)) { toast('已保存'); next(); }
      } else if (r.act === 'discard') {
        setDirty(false);
        next();
      }
      /* cancel / 点遮罩：什么都不做 */
    });
  }

  /* ============================================================
   * 7.2 通用弹窗（替代原生 confirm / prompt）
   *   opts = { title, msg, fields?, actions:[{label,value,kind}] }
   *   fields 为可编辑输入项；resolve 出 { act, values }
   * ============================================================ */
  function ask(opts) {
    return new Promise(function (resolve) {
      var box = $('#dlg');
      var acts = $('#dlgActs');
      var oldFields = box.querySelector('.dlg-fields');
      if (oldFields) oldFields.parentNode.removeChild(oldFields);

      $('#dlgTitle').textContent = opts.title || '';
      $('#dlgMsg').textContent = opts.msg || '';

      var inputs = {};
      if (opts.fields && opts.fields.length) {
        var fw = document.createElement('div');
        fw.className = 'dlg-fields';
        opts.fields.forEach(function (f) {
          var lab = document.createElement('div');
          lab.className = 'dlg-flabel';
          lab.textContent = f.label || '';
          var inp = f.multiline ? document.createElement('textarea') : document.createElement('input');
          if (!f.multiline) inp.type = 'text';
          inp.className = 'dlg-finput';
          inp.value = f.value == null ? '' : f.value;
          if (f.placeholder) inp.placeholder = f.placeholder;
          inputs[f.key] = inp;
          fw.appendChild(lab);
          fw.appendChild(inp);
        });
        box.querySelector('.dlg-body').appendChild(fw);
      }

      acts.innerHTML = '';
      var done = false;
      function finish(v) {
        if (done) return;
        done = true;
        var values = {};
        Object.keys(inputs).forEach(function (k) { values[k] = inputs[k].value; });
        document.removeEventListener('keydown', onKey, true);
        box.classList.add('hidden');
        box.setAttribute('aria-hidden', 'true');
        resolve({ act: v, values: values });
      }
      (opts.actions || []).forEach(function (a) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'dlg-btn' +
          (a.kind === 'primary' ? ' is-primary' :
           a.kind === 'destructive' ? ' is-destructive' : ' is-ghost');
        b.textContent = a.label;
        b.dataset.dlgAct = a.value;
        acts.appendChild(b);
      });
      acts.onclick = function (e) {
        var b = e.target.closest ? e.target.closest('[data-dlg-act]') : null;
        if (b) finish(b.dataset.dlgAct);
      };
      box.querySelector('.dlg-mask').onclick = function () { finish('cancel'); };

      function onKey(e) {
        if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); finish('cancel'); return; }
        if (e.key === 'Enter' && e.target && e.target.tagName !== 'TEXTAREA') {
          var p = (opts.actions || []).filter(function (a) { return a.kind === 'primary'; })[0];
          e.preventDefault(); e.stopPropagation();
          finish(p ? p.value : 'cancel');
        }
      }
      document.addEventListener('keydown', onKey, true);

      box.classList.remove('hidden');
      box.setAttribute('aria-hidden', 'false');
      var first = opts.fields && opts.fields.length ? inputs[opts.fields[0].key]
        : acts.querySelector('.dlg-btn');
      if (first) first.focus();
      if (first && first.select && !opts.fields) { /* 无需选中 */ }
    });
  }

  function dialogOpen() {
    var d = $('#dlg');
    return !!d && !d.classList.contains('hidden');
  }

  /* ============================================================
   * 7.5 偏好设置：主题 + 批注人
   *   与具体文档无关，单独存在 qqpc:settings 里。
   *   批注人只保存一个姓名：头像取姓名后两个字，导出时用作署名。
   * ============================================================ */
  var SETTINGS = { theme: 'light', annotator: '' };

  function loadSettings() {
    var s = store.settings() || {};
    SETTINGS.theme = (s.theme === 'dark' || s.theme === 'light')
      ? s.theme
      : (document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light');
    var nm = (s.annotator && s.annotator.name) || s.annotator || s.author || '';
    SETTINGS.annotator = String(nm).trim().slice(0, 12);
  }

  function persistSettings() {
    store.setSettings({
      theme: SETTINGS.theme,
      annotator: { name: SETTINGS.annotator }
    });
  }

  function applyTheme(t, persist) {
    SETTINGS.theme = (t === 'dark') ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', SETTINGS.theme);
    if (persist) persistSettings();
    renderThemeBtn();
  }

  function toggleTheme() {
    var next = SETTINGS.theme === 'dark' ? 'light' : 'dark';
    applyTheme(next, true);
    toast(next === 'dark' ? '已切换到深色主题' : '已切换到浅色主题');
  }

  function renderThemeBtn() {
    var b = $('#btnTheme');
    if (!b) return;
    b.innerHTML = SETTINGS.theme === 'dark' ? ICONS.sun : ICONS.moon;
    b.title = SETTINGS.theme === 'dark' ? '切换为浅色主题' : '切换为深色主题';
  }

  function annotatorName() { return SETTINGS.annotator || ''; }

  /* 头像上的字：取姓名后两个字；两字及以内直接用全名 */
  function annotatorInitials(name) {
    var n = String(name == null ? SETTINGS.annotator : name).trim();
    if (!n) return '＋';
    return n.length <= 2 ? n : n.slice(-2);
  }

  function renderWho() {
    var n = annotatorName();
    var ini = annotatorInitials(n);
    var av = $('#whoAvatar'), avb = $('#whoAvatarBig');
    if (av) av.textContent = ini;
    if (avb) avb.textContent = ini;
    var nm = $('#whoName');
    if (nm) nm.textContent = n || '批注人';
    var btn = $('#btnWho');
    if (btn) btn.classList.toggle('is-empty', !n);
    var inp = $('#whoInput');
    if (inp && document.activeElement !== inp) inp.value = n;
  }

  /* 改动只影响之后新建的批注与导出抬头，不追溯修改历史署名 */
  function setAnnotator(name) {
    var n = String(name || '').trim().replace(/\s+/g, ' ').slice(0, 12);
    var changed = n !== SETTINGS.annotator;
    SETTINGS.annotator = n;
    persistSettings();
    renderWho();
    if (changed) toast(n ? '批注人已设为「' + n + '」' : '已清空批注人');
  }

  /* ---------- 窄屏视图切换（底部导航） ---------- */
  function isNarrow() {
    return !!(window.matchMedia && window.matchMedia('(max-width:980px)').matches);
  }

  function setMView(v) {
    if (v !== 'docs' && v !== 'main' && v !== 'ann') v = 'main';
    document.body.setAttribute('data-mview', v);
    $$('.mnav button').forEach(function (b) {
      b.classList.toggle('is-on', b.dataset.mview === v);
    });
  }

  function hidePops() {
    var m = $('#exportMenu');
    if (m) m.classList.add('hidden');
    var p = $('#whoPop');
    if (p) p.classList.add('hidden');
  }

  function syncIndexEntry() {
    var list = store.index();
    var meta = {
      id: STATE.doc.id,
      kind: STATE.doc.kind || 'text',
      title: STATE.doc.title,
      updatedAt: STATE.doc.updatedAt,
      annCount: annCountOf(STATE.doc)
    };
    var found = false;
    for (var i = 0; i < list.length; i++) {
      if (list[i].id === STATE.doc.id) {
        list[i] = meta;
        found = true;
        break;
      }
    }
    if (!found) list.unshift(meta);
    list.sort(function (a, b) { return b.updatedAt - a.updatedAt; });
    store.setIndex(list);
  }

  /* 有文字意见的标注才算「一条批注」；纯划线的图形不进清单，也不占编号 */
  function annCountOf(doc) {
    if (!doc) return 0;
    if (doc.kind === 'image') return imageNoteMarks(doc).length;
    return (doc.annotations || []).length;
  }

  function newDoc(raw, title) {
    var now = Date.now();
    return {
      schemaVersion: 1,
      kind: 'text',
      id: uid('doc_'),
      title: title || '未命名推送',
      raw: raw || '',
      annotations: [],
      createdAt: now,
      updatedAt: now
    };
  }

  /* 图片批改文档。
     为什么要单独一个 kind 而不是复用 raw：截图里根本没有可切片的原文，
     批注锚在「图片上的坐标」而不是「字符串偏移」，两者的数据形状不同。
     annotations 字段保留空数组，是为了让导出/统计等通用代码不用到处判空。 */
  function newImageDoc(title) {
    var now = Date.now();
    return {
      schemaVersion: 1,
      kind: 'image',
      id: uid('doc_'),
      title: title || '未命名图片批改',
      raw: '',
      image: null,          // { dataUrl, w, h, mime }
      marks: [],            // 圈点勾画：图形 + 意见
      annotations: [],
      createdAt: now,
      updatedAt: now
    };
  }

  /* 旧数据（本工具早期版本没有 kind 字段）一律按文字文档处理 */
  function normalizeDoc(d) {
    if (!d) return d;
    d.kind = d.kind === 'image' ? 'image' : 'text';
    d.annotations = d.annotations || [];
    if (d.kind === 'image') d.marks = d.marks || [];
    return d;
  }

  function openDoc(id) {
    if (STATE.doc && STATE.doc.id === id) return;
    guardUnsaved(function () {
      var d = store.doc(id);
      if (!d) { toast('文档不存在'); return; }
      normalizeDoc(d);
      STATE.doc = d;
      STATE.focusAnnId = null;
      $('#docTitle').value = d.title;
      STATE.mode = defaultModeFor(d);
      if (STATE.mode === 'edit' && d.kind === 'text') $('#editor').value = d.raw;
      hideImgComposer();
      setDirty(false);
      renderAll();
      if (isNarrow()) setMView('main');
    });
  }

  /* 图片文档没图时应该直接落在「编辑」（上传区），有图则直奔「批注」 */
  function defaultModeFor(d) {
    if (d && d.kind === 'image') {
      return (d.image && d.image.dataUrl) ? 'annotate' : 'edit';
    }
    return 'annotate';
  }

  /* ---------- 草稿（还没落盘的全新文档） ---------- */
  function isIndexed(id) {
    return store.index().some(function (x) { return x.id === id; });
  }

  function isBlankDoc(d) {
    if (!d) return true;
    if (d.kind === 'image') {
      return !(d.image && d.image.dataUrl) && !(d.marks || []).length;
    }
    return !String(d.raw || '').trim() && !(d.annotations || []).length;
  }

  /* 已经是同类型的空白草稿就复用它，避免连点「新建」堆出一串空文档 */
  function canReuseDraft(kind) {
    return !!(STATE.doc && STATE.doc.kind === kind &&
              isBlankDoc(STATE.doc) && !isIndexed(STATE.doc.id));
  }

  function startDraft(kind) {
    var d = kind === 'image' ? newImageDoc('未命名图片批改') : newDoc('', '未命名推送');
    STATE.doc = d;
    STATE.focusAnnId = null;
    $('#docTitle').value = d.title;
    STATE.mode = 'edit';
    hideImgComposer();
    setDirty(false);        /* 全新的空白文档，没有「未保存的改动」可言 */
    renderAll();
    if (kind === 'image') toast('把截图拖进来，或直接 Ctrl + V 粘贴');
    else $('#editor').focus();
    if (isNarrow()) setMView('main');
  }

  function createDoc() {
    if (canReuseDraft('text')) { $('#editor').focus(); $('#editor').select(); return; }
    guardUnsaved(function () { startDraft('text'); });
  }

  function createImageDoc() {
    if (canReuseDraft('image')) { $('#imgFile').click(); return; }
    guardUnsaved(function () { startDraft('image'); });
  }

  function deleteDoc(id) {
    var d = store.doc(id) || (STATE.doc && STATE.doc.id === id ? STATE.doc : null);
    var name = (d && d.title) || '该文档';
    var isCur = STATE.doc && STATE.doc.id === id;
    var isDraft = !isIndexed(id);
    var msg = isDraft
      ? '「' + name + '」还没保存过，关掉就找不回来了。'
      : '「' + name + '」将被永久删除，无法撤销。';
    if (isCur && STATE.dirty && !isDraft) msg += '\n当前还有未保存的改动，也会一并消失。';
    ask({
      title: isDraft ? '丢弃这份草稿' : '删除文档',
      msg: msg,
      actions: [
        { label: isDraft ? '丢弃' : '删除', value: 'yes', kind: 'destructive' },
        { label: '取消', value: 'no', kind: 'ghost' }
      ]
    }).then(function (r) {
      if (r.act !== 'yes') return;
      store.removeDoc(id);
      var list = store.index().filter(function (x) { return x.id !== id; });
      store.setIndex(list);
      setDirty(false);

      if (isCur) {
        if (list.length) openDoc(list[0].id);
        else startDraft('text');
      } else {
        renderDocList();
      }
    });
  }

  /* ============================================================
   * 8. 批注锚点修复（改原文后）
   * ============================================================ */
  function realignAnnotations() {
    var raw = STATE.doc.raw;
    var tokens = lex(raw);
    var fixed = 0, lost = 0;

    STATE.doc.annotations.forEach(function (a) {
      if (raw.slice(a.start, a.end) === a.quote) {
        if (a.lost) { a.lost = false; fixed++; }
        return;
      }
      var idx = raw.indexOf(a.quote);
      if (a.quote.length > 0 && idx >= 0 && raw.indexOf(a.quote, idx + 1) === -1) {
        a.start = idx;
        a.end = idx + a.quote.length;
        a.start = snapToToken(tokens, a.start, -1);
        a.end = snapToToken(tokens, a.end, 1);
        if (a.lost) { a.lost = false; fixed++; }
      } else {
        a.lost = true;
        lost++;
      }
    });

    if (lost > 0) toast(lost + ' 条批注因原文改动而失联，请在右侧确认');
    else if (fixed > 0) toast(fixed + ' 条批注位置已自动修正');
  }

  /* ============================================================
   * 9. 渲染总入口
   * ============================================================ */
  function renderAll() {
    renderDocList();
    renderBody_();
    renderSidebar();
    renderTabs();
    renderExportMenu();
    $('#docCount').textContent = store.index().length;
  }

  function renderTabs() {
    $$('.tab').forEach(function (t) {
      t.classList.toggle('is-active', t.dataset.mode === STATE.mode);
    });
    var img = STATE.doc && STATE.doc.kind === 'image';
    var hints = img ? {
      edit: '把推送截图放进来：拖拽 / Ctrl + V 粘贴 / 点按钮选择',
      annotate: '选个工具，在图上圈点勾画；画完就能顺手写意见',
      preview: '这是干事看到的样子（只读）'
    } : {
      edit: '粘贴或修改原文，切回「批注」会自动校正已有批注位置',
      annotate: '拖选正文文字即可添加批注',
      preview: '这是发出去之后的观感'
    };
    $('#modeHint').textContent = hints[STATE.mode] || '';
  }

  function renderBody_() {
    var editor = $('#editor');
    var bubble = $('#bubble');
    var bar = $('#floatingBar');
    var stage = $('#imgStage');

    if (STATE.doc && STATE.doc.kind === 'image') {
      editor.classList.add('hidden');
      bubble.classList.add('hidden');
      hideFloating();
      stage.classList.remove('hidden');
      renderImgStage();
      return;
    }

    stage.classList.add('hidden');
    hideImgComposer();

    if (STATE.mode === 'edit') {
      editor.classList.remove('hidden');
      bubble.classList.add('hidden');
      hideFloating();
      if (document.activeElement !== editor) editor.value = STATE.doc.raw;
      return;
    }

    editor.classList.add('hidden');
    bubble.classList.remove('hidden');
    bubble.classList.toggle('is-preview', STATE.mode === 'preview');
    bubble.innerHTML = '';

    if (!STATE.doc.raw.trim()) {
      bubble.innerHTML = '<div class="empty">还没有内容。<br>切到「编辑」把干事发来的推送粘进来吧。</div>';
      return;
    }

    var anns = STATE.doc.annotations.filter(function (a) { return !a.lost; });
    bubble.appendChild(renderBody(
      STATE.doc.raw,
      anns,
      { noHighlight: STATE.mode === 'preview' }
    ));
    hideFloating();
  }

  function renderDocList() {
    var list = store.index();
    var box = $('#docList');
    box.innerHTML = '';

    /* 还没落盘的草稿要显示出来，否则用户会以为「我建的东西不见了」。
       它不是索引里的真实数据，只在内存里，所以单独标一个「未保存」。 */
    var rows = list.slice();
    if (STATE.doc && !isIndexed(STATE.doc.id)) {
      rows = [{
        id: STATE.doc.id, kind: STATE.doc.kind, title: STATE.doc.title,
        updatedAt: STATE.doc.updatedAt, annCount: annCountOf(STATE.doc), _draft: true
      }].concat(list);
    }
    $('#docCount').textContent = rows.length;

    if (!rows.length) {
      box.innerHTML = '<div class="empty">还没有文档<br>点上面的按钮新建一份</div>';
      return;
    }

    rows.forEach(function (item) {
      var el = document.createElement('div');
      el.className = 'doc-item' + (STATE.doc && STATE.doc.id === item.id ? ' is-active' : '');
      var isImg = item.kind === 'image';
      el.innerHTML =
        '<button class="doc-item-x" title="删除" aria-label="删除文档">' + ICONS.close + '</button>' +
        '<div class="doc-item-head">' +
          '<span class="doc-kind' + (isImg ? ' k-img' : '') + '">' + (isImg ? '图' : '文') + '</span>' +
          '<span class="doc-item-title"></span>' +
        '</div>' +
        '<div class="doc-item-meta">' +
          '<span>' + (item._draft ? '<span class="doc-unsaved">未保存</span>' : fmtTime(item.updatedAt)) + '</span>' +
          '<span>' + (item.annCount || 0) + ' 条批注</span>' +
        '</div>';
      $('.doc-item-title', el).textContent = item.title || '未命名推送';
      el.addEventListener('click', function (e) {
        if (e.target.closest && e.target.closest('.doc-item-x')) {
          e.stopPropagation();
          deleteDoc(item.id);
          return;
        }
        if (STATE.doc && STATE.doc.id === item.id) return;
        openDoc(item.id);
      });
      box.appendChild(el);
    });
  }

  /* 侧栏批注清单 */
  function renderSidebar() {
    var all = listForSidebar();
    var listEl = $('#annList');
    $('#annCount').textContent = all.length;

    var filter = STATE.filter;
    var shown = all.filter(function (a) {
      if (filter === 'all') return true;
      if (filter === 'open') return !a.resolved;
      if (filter === 'done') return a.resolved;
      return a.type === filter;
    });

    var sorted = shown.slice().sort(function (a, b) {
      if (a.start !== b.start) return a.start - b.start;
      return a.end - b.end;
    });

    listEl.innerHTML = '';
    if (!sorted.length) {
      var isImg = STATE.doc && STATE.doc.kind === 'image';
      listEl.innerHTML = '<div class="empty">' +
        (all.length ? '当前筛选下没有批注'
          : (isImg
              ? '还没有批注。<br>在图上画个框、圈或箭头，<br>就能顺手写下第一条意见。'
              : '还没有批注。<br>在正文里拖选文字，<br>就能添加第一条意见了。')) +
        '</div>';
      return;
    }

    var numberMap = {};
    all.slice().sort(function (a, b) { return a.start - b.start || a.end - b.end; })
      .forEach(function (a, i) { numberMap[a.id] = i + 1; });

    sorted.forEach(function (a) {
      var card = document.createElement('div');
      card.className = 'ann-card t-' + a.type +
        (STATE.focusAnnId === a.id ? ' is-focus' : '') +
        (a.resolved ? ' is-done' : '');
      card.dataset.annId = a.id;

      var typeInfo = TYPE_MAP[a.type] || TYPE_MAP.general;
      var quote = a.quote ||
        (STATE.doc.kind === 'image' ? '' : STATE.doc.raw.slice(a.start, a.end));
      card.innerHTML =
        '<div class="ann-top">' +
          '<span class="ann-no">' + (numberMap[a.id] || '·') + '</span>' +
          '<span class="ann-type"></span>' +
          '<span class="grow"></span>' +
          '<button class="ann-act" data-act="done">' + (a.resolved ? '撤销' : '解决') + '</button>' +
          '<button class="ann-act" data-act="edit">编辑</button>' +
          '<button class="ann-act" data-act="del">删除</button>' +
        '</div>' +
        '<div class="ann-quote"></div>' +
        '<div class="ann-body"></div>' +
        (a.suggestion ? '<div class="ann-sug"></div>' : '') +
        (a.lost ? '<div class="ann-warn">原文已改动，此批注找不到原位置。' +
          '<button data-act="relocate">重新指定</button>' +
          '<button data-act="dismiss">转为整体意见</button></div>' : '');

      $('.ann-type', card).textContent = typeInfo.label;
      $('.ann-quote', card).textContent = quote.length > 60 ? quote.slice(0, 60) + '…' : quote;
      $('.ann-body', card).textContent = a.body || '（未填写意见）';
      var sug = $('.ann-sug', card);
      if (sug) sug.textContent = '建议改为：' + a.suggestion;

      card.addEventListener('click', function (e) {
        var act = e.target.dataset ? e.target.dataset.act : null;
        if (act === 'done') { e.stopPropagation(); toggleResolved(a.id); return; }
        if (act === 'del') { e.stopPropagation(); removeAnnotation(a.id); return; }
        if (act === 'edit') { e.stopPropagation(); editAnnotation(a.id); return; }
        if (act === 'relocate') { e.stopPropagation(); relocate(a.id); return; }
        if (act === 'dismiss') { e.stopPropagation(); dismissLost(a.id); return; }
        focusAnnotation(a.id);
      });

      listEl.appendChild(card);
    });
  }

  /* ============================================================
   * 10. 批注操作
   * ============================================================ */
  /* 图片文档的批注藏在 marks 里，文字文档在 annotations 里。
     下面这几个取值器把差异收在一处，上层逻辑就不用到处 if 了。 */
  function annCollection() {
    if (!STATE.doc) return [];
    return STATE.doc.kind === 'image' ? (STATE.doc.marks || []) : (STATE.doc.annotations || []);
  }

  function setAnnCollection(list) {
    if (!STATE.doc) return;
    if (STATE.doc.kind === 'image') STATE.doc.marks = list;
    else STATE.doc.annotations = list;
  }

  function listForSidebar() {
    if (!STATE.doc) return [];
    return STATE.doc.kind === 'image' ? imageNoteMarks(STATE.doc) : STATE.doc.annotations;
  }

  function findAnn(id) {
    var list = annCollection();
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }

  function annMap() {
    var m = {};
    annCollection().forEach(function (a) { m[a.id] = a; });
    return m;
  }

  function addAnnotation(sel, type, body, suggestion) {
    var ann = {
      id: uid('ann_'),
      start: sel.start,
      end: sel.end,
      quote: STATE.doc.raw.slice(sel.start, sel.end),
      type: type,
      body: body,
      suggestion: suggestion || '',
      author: annotatorName(),
      resolved: false,
      lost: false,
      createdAt: Date.now()
    };
    STATE.doc.annotations.push(ann);
    touch();
    STATE.focusAnnId = ann.id;
    renderBody_();
    renderSidebar();
    return ann;
  }

  function removeAnnotation(id) {
    var a = findAnn(id);
    if (!a) return;
    ask({
      title: '删除这条批注',
      msg: STATE.doc.kind === 'image' ? '这条标注的图形也会一起删除。' : '',
      actions: [
        { label: '删除', value: 'yes', kind: 'destructive' },
        { label: '取消', value: 'no', kind: 'ghost' }
      ]
    }).then(function (r) {
      if (r.act !== 'yes') return;
      setAnnCollection(annCollection().filter(function (x) { return x.id !== id; }));
      if (STATE.focusAnnId === id) STATE.focusAnnId = null;
      touch();
      renderBody_();
      renderSidebar();
    });
  }

  function toggleResolved(id) {
    var a = findAnn(id);
    if (a) a.resolved = !a.resolved;
    touch();
    renderBody_();
    renderSidebar();
  }

  function editAnnotation(id) {
    var a = findAnn(id);
    if (!a) return;
    ask({
      title: '修改意见',
      fields: [
        { key: 'body', label: '意见', value: a.body || '', multiline: true },
        { key: 'sug', label: '建议改成', value: a.suggestion || '', placeholder: '留空表示不给具体改法' }
      ],
      actions: [
        { label: '保存', value: 'ok', kind: 'primary' },
        { label: '取消', value: 'cancel', kind: 'ghost' }
      ]
    }).then(function (r) {
      if (r.act !== 'ok') return;
      var body = String(r.values.body || '').trim();
      if (!body) { toast('意见不能为空'); return; }
      a.body = body;
      a.suggestion = String(r.values.sug || '').trim();
      touch();
      renderBody_();
      renderSidebar();
    });
  }

  function relocate(id) {
    var a = STATE.doc.annotations.filter(function (x) { return x.id === id; })[0];
    if (!a) return;
    switchMode('annotate');
    toast('请在正文中重新框选这段文字');
    relocateTarget = id;
  }

  var relocateTarget = null;

  function dismissLost(id) {
    var a = STATE.doc.annotations.filter(function (x) { return x.id === id; })[0];
    if (!a) return;
    a.lost = false;
    a.type = 'general';
    a.start = 0;
    a.end = 0;
    a.quote = '';
    toast('已转为全文整体意见');
    touch();
    renderBody_();
    renderSidebar();
  }

  function focusAnnotation(id) {
    STATE.focusAnnId = id;
    renderSidebar();

    /* 图片文档：高亮对应的图形，并把画布滚到它那里 */
    if (STATE.doc && STATE.doc.kind === 'image') {
      var m = findAnn(id);
      if (!m) return;
      DRAW.sel = id;
      paintMarks();
      scrollMarkIntoView(m);
      setTimeout(function () {
        if (DRAW.sel === id && (!DRAW.dur || DRAW.dur !== id)) { DRAW.sel = null; paintMarks(); }
      }, 1800);
      return;
    }

    var el = $('#bubble').querySelector('[data-ann~="' + id + '"]');
    if (!el) return;
    el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    $$('#bubble .is-focus').forEach(function (n) { n.classList.remove('is-focus'); });
    $$('#bubble [data-ann~="' + id + '"]').forEach(function (n) { n.classList.add('is-focus'); });
    setTimeout(function () {
      $$('#bubble [data-ann~="' + id + '"]').forEach(function (n) { n.classList.remove('is-focus'); });
    }, 1600);
  }

  /* 点击正文高亮 → 定位侧栏 */
  function onBodyClick(e) {
    var el = e.target.closest ? e.target.closest('[data-ann]') : null;
    if (!el || !$('#bubble').contains(el)) return;
    var ids = el.dataset.ann.split(/\s+/).filter(Boolean);
    var target = ids[ids.length - 1];
    var vm = annMap();
    if (vm[target] && vm[target].lost) { return; }
    STATE.focusAnnId = target;
    renderSidebar();
    var card = $('#annList').querySelector('[data-ann-id="' + target + '"]');
    if (card) {
      card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      card.classList.add('is-focus');
      setTimeout(function () { card.classList.remove('is-focus'); }, 1600);
    }
  }

  /* ============================================================
   * 11. 选区 → 偏移换算
   * ============================================================ */
  function boundaryOffset(node, offset, isEnd) {
    if (node.nodeType === 3) {
      var sp = node.parentElement && node.parentElement.closest('[data-s]');
      if (!sp) return null;
      return Number(sp.dataset.s) + offset;
    }
    if (node.nodeType !== 1) return null;

    var self = node.closest ? node.closest('[data-s]') : null;
    if (self) {
      var len = self.dataset.e ? Number(self.dataset.e) - Number(self.dataset.s) : 0;
      var textLen = self.childNodes.length ? (self.textContent || '').length : 0;
      if (offset <= 0) return Number(self.dataset.s);
      if (offset >= textLen || offset >= Math.max(len, textLen)) return Number(self.dataset.e);
      return Number(self.dataset.s) + offset;
    }

    var kids = node.childNodes;
    if (isEnd) {
      if (offset <= 0) {
        var prev = node.previousElementSibling;
        while (prev) {
          var ps = prev.querySelectorAll ? prev.querySelectorAll('[data-s]') : [];
          if (prev.dataset && prev.dataset.s !== undefined) return Number(prev.dataset.e);
          if (ps.length) return Number(ps[ps.length - 1].dataset.e);
          prev = prev.previousElementSibling;
        }
        return null;
      }
      if (offset > kids.length) offset = kids.length;
      var c = kids[offset - 1];
      if (!c) return null;
      if (c.nodeType === 1) {
        if (c.dataset && c.dataset.e !== undefined) return Number(c.dataset.e);
        var inner = c.querySelectorAll ? c.querySelectorAll('[data-s]') : [];
        if (inner.length) return Number(inner[inner.length - 1].dataset.e);
      }
      if (c.nodeType === 3) {
        var cp = c.parentElement && c.parentElement.closest('[data-s]');
        return cp ? Number(cp.dataset.s) + c.textContent.length : null;
      }
      return null;
    }

    if (offset >= kids.length) {
      var lastAll = node.querySelectorAll('[data-s]');
      return lastAll.length ? Number(lastAll[lastAll.length - 1].dataset.e) : null;
    }
    var k = kids[offset];
    if (!k) return null;
    if (k.nodeType === 1) {
      if (k.dataset && k.dataset.s !== undefined) return Number(k.dataset.s);
      var inn = k.querySelectorAll ? k.querySelectorAll('[data-s]') : [];
      if (inn.length) return Number(inn[0].dataset.s);
    }
    if (k.nodeType === 3) {
      var kp = k.parentElement && k.parentElement.closest('[data-s]');
      return kp ? Number(kp.dataset.s) : null;
    }
    return null;
  }

  function readSelection() {
    var sel = window.getSelection();
    if (!sel || sel.isCollapsed || sel.rangeCount === 0) return null;
    var range = sel.getRangeAt(0);
    var bubble = $('#bubble');
    if (!bubble.contains(range.startContainer) || !bubble.contains(range.endContainer)) return null;

    var s = boundaryOffset(range.startContainer, range.startOffset, false);
    var e = boundaryOffset(range.endContainer, range.endOffset, true);
    if (s === null || e === null) return null;
    if (s > e) { var tmp = s; s = e; e = tmp; }
    if (s === e) return null;

    var raw = STATE.doc.raw;
    var tokens = lex(raw);
    s = snapToToken(tokens, s, -1);
    e = snapToToken(tokens, e, 1);

    while (s < e && /\s/.test(raw[s])) s++;
    while (e > s && /\s/.test(raw[e - 1])) e--;
    if (s >= e) return null;

    return { start: s, end: e, quote: raw.slice(s, e), rect: range.getBoundingClientRect() };
  }

  function showFloating(sel) {
    if (!sel || !sel.rect) return;
    var bar = $('#floatingBar');
    bar.classList.remove('hidden');
    bar.innerHTML = '';

    if (relocateTarget) {
      var t = TYPE_MAP[(annMap()[relocateTarget] || {}).type] || TYPE_MAP.general;
      var tip = document.createElement('div');
      tip.className = 'fb-tip';
      tip.textContent = '重新指定「' + t.label + '」批注的位置：';
      bar.appendChild(tip);
      var ok = document.createElement('button');
      ok.className = 'fb-btn is-solid';
      ok.textContent = '就这里';
      ok.addEventListener('click', function () {
        var a = annMap()[relocateTarget];
        if (a) {
          a.start = sel.start; a.end = sel.end; a.quote = sel.quote; a.lost = false;
          toast('位置已更新');
          touch();
        }
        relocateTarget = null;
        hideFloating();
        renderBody_();
        renderSidebar();
      });
      bar.appendChild(ok);
      var cancel = document.createElement('button');
      cancel.className = 'fb-btn';
      cancel.textContent = '取消';
      cancel.addEventListener('click', function () { relocateTarget = null; hideFloating(); });
      bar.appendChild(cancel);
      positionFloating(bar, sel.rect);
      return;
    }

    TYPES.forEach(function (t) {
      var b = document.createElement('button');
      b.className = 'fb-btn';
      b.innerHTML = '<span class="fb-dot" style="background:' + t.dot + '"></span>' + t.label;
      b.addEventListener('mousedown', function (ev) { ev.preventDefault(); });
      b.addEventListener('click', function () { showComposer(sel, t.key); });
      bar.appendChild(b);
    });

    positionFloating(bar, sel.rect);
  }

  function positionFloating(bar, rect) {
    var bw = bar.offsetWidth || 420;
    var bh = bar.offsetHeight || 40;
    var left = rect.left + rect.width / 2 - bw / 2;
    var top = rect.top - bh - 10;
    if (top < 8) top = rect.bottom + 10;
    left = Math.max(10, Math.min(left, window.innerWidth - bw - 10));
    top = Math.max(8, Math.min(top, window.innerHeight - bh - 10));
    bar.style.left = left + 'px';
    bar.style.top = top + 'px';
  }

  function showComposer(sel, typeKey) {
    var bar = $('#floatingBar');
    var t = TYPE_MAP[typeKey];
    bar.innerHTML = '';

    var wrap = document.createElement('div');
    wrap.className = 'composer';

    var quote = document.createElement('div');
    quote.className = 'composer-quote';
    quote.textContent = '「' + (sel.quote.length > 40 ? sel.quote.slice(0, 40) + '…' : sel.quote) + '」';
    wrap.appendChild(quote);

    var ta = document.createElement('textarea');
    ta.placeholder = '写清要改什么（Ctrl + Enter 提交）';
    wrap.appendChild(ta);

    var input = document.createElement('input');
    input.type = 'text';
    input.placeholder = '建议改成什么（可留空）';
    wrap.appendChild(input);

    var chips = document.createElement('div');
    chips.className = 'chips';
    TEMPLATES.slice(0, 4).forEach(function (txt) {
      var c = document.createElement('button');
      c.className = 'chip';
      c.type = 'button';
      c.textContent = txt.length > 14 ? txt.slice(0, 14) + '…' : txt;
      c.title = txt;
      c.addEventListener('mousedown', function (ev) { ev.preventDefault(); });
      c.addEventListener('click', function () {
        ta.value = ta.value ? ta.value + '\n' + txt : txt;
        ta.focus();
      });
      chips.appendChild(c);
    });
    wrap.appendChild(chips);

    var actions = document.createElement('div');
    actions.className = 'composer-actions';

    var cancel = document.createElement('button');
    cancel.className = 'btn-sm';
    cancel.type = 'button';
    cancel.textContent = '取消';
    cancel.addEventListener('click', hideFloating);

    var submit = document.createElement('button');
    submit.className = 'btn-sm primary';
    submit.type = 'button';
    submit.innerHTML = '<span class="fb-dot" style="background:' + t.dot + '"></span>提交批注';
    submit.addEventListener('click', function () {
      var body = ta.value.trim();
      if (!body && !input.value.trim()) { toast('至少写一句意见吧'); ta.focus(); return; }
      addAnnotation(sel, typeKey, body, input.value.trim());
      hideFloating();
      window.getSelection().removeAllRanges();
      toast('批注已添加');
    });

    actions.appendChild(cancel);
    actions.appendChild(submit);
    wrap.appendChild(actions);
    bar.appendChild(wrap);

    ta.addEventListener('keydown', function (ev) {
      if ((ev.ctrlKey || ev.metaKey) && ev.key === 'Enter') { ev.preventDefault(); submit.click(); }
      if (ev.key === 'Escape') hideFloating();
    });
    input.addEventListener('keydown', function (ev) {
      if ((ev.ctrlKey || ev.metaKey) && ev.key === 'Enter') { ev.preventDefault(); submit.click(); }
      if (ev.key === 'Escape') hideFloating();
    });

    var rect = sel.rect;
    bar.style.left = '0px';
    bar.style.top = '0px';
    setTimeout(function () {
      var r = rect;
      var bw = bar.offsetWidth || 440;
      var bh = bar.offsetHeight || 200;
      var left = r.left + r.width / 2 - bw / 2;
      var top = r.top - bh - 10;
      if (top < 8) top = r.bottom + 10;
      left = Math.max(10, Math.min(left, window.innerWidth - bw - 10));
      top = Math.max(8, Math.min(top, window.innerHeight - bh - 10));
      bar.style.left = left + 'px';
      bar.style.top = top + 'px';
      ta.focus();
    }, 0);
  }

  function hideFloating() {
    var bar = $('#floatingBar');
    bar.classList.add('hidden');
    bar.innerHTML = '';
  }

  var onSelectChange = debounce(function () {
    if (STATE.mode !== 'annotate') return;
    /* 图片文档没有文字选区，浮动条走的是另一条路 */
    if (STATE.doc && STATE.doc.kind === 'image') return;
    var bar = $('#floatingBar');
    if (bar.contains(document.activeElement)) return;
    var sel = readSelection();
    if (!sel) {
      if (!bar.matches(':hover')) hideFloating();
      return;
    }
    STATE.pendingSel = sel;
    showFloating(sel);
  }, 180);

  /* ============================================================
   * 12. 模式切换
   * ============================================================ */
  function switchMode(mode) {
    if (mode === STATE.mode) return;

    if (STATE.mode === 'edit' && STATE.doc.kind !== 'image') {
      var v = $('#editor').value;
      if (v !== STATE.doc.raw) {
        STATE.doc.raw = v;
        realignAnnotations();
        touch();
      }
    }
    STATE.mode = mode;
    hideFloating();
    hideImgComposer();
    renderTabs();
    renderBody_();
    renderSidebar();
  }

  /* ============================================================
   * 12.5 图片批改
   *
   *   为什么改走截图：QQ 表情在网页里没有稳定可靠的还原方式，
   *   而截图本身就是「发出去长什么样」的权威版本——零解析、零失真，
   *   圈点勾画也比对着文字更接近纸面改稿的手感。
   *
   *   坐标约定（这一条是整套设计的基石）：
   *   所有图形一律用「归一化比例」(0~1) 存，渲染时再乘回图片原始宽高。
   *   于是显示缩放、换设备、导出长图三条路径共用同一份数据，
   *   标注永远不会因为尺寸变化而跑偏。
   * ============================================================ */
  var IMG_TOOLS = [
    { key: 'select',    label: '选择' },
    { key: 'rect',      label: '方框' },
    { key: 'ellipse',   label: '圆圈' },
    { key: 'arrow',     label: '箭头' },
    { key: 'pen',       label: '画笔' },
    { key: 'highlight', label: '高亮框' },
    { key: 'pin',       label: '标点' }
  ];
  var IMG_TOOL_MAP = {};
  IMG_TOOLS.forEach(function (t) { IMG_TOOL_MAP[t.key] = t; });

  /* 所有工具画完都立刻弹意见框。
     曾经把画笔 / 高亮排除在外（想当"只划重点"用），结果每次都得多点一下
     「选择」再点图形才能写意见 —— 圈点勾画本来就是为了配意见，
     少一步操作比"支持纯划线"值钱得多。 */

  var IMG_COLORS = ['#FF3B30', '#FF9500', '#FFCC00', '#34C759', '#007AFF', '#AF52DE'];

  var IMG_WIDTHS = [
    { key: 'thin',  label: '细', v: 0.0030 },
    { key: 'mid',   label: '中', v: 0.0050 },
    { key: 'thick', label: '粗', v: 0.0080 }
  ];
  var IMG_WMAP = {};
  IMG_WIDTHS.forEach(function (w) { IMG_WMAP[w.key] = w; });

  var IMG_MAX_DIM = 1500;         /* 长边超过这个值就等比缩小 */
  var IMG_BUDGET = 720 * 1024;    /* base64 字符预算：localStorage 是按字符数吃配额的 */

  var CANVAS_FONT = '-apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif';
  var SVGNS = 'http://www.w3.org/2000/svg';

  /* 手上的笔。刻意不塞进 STATE：它是当前操作状态，不是文档内容 */
  var DRAW = {
    tool: 'rect',
    color: IMG_COLORS[0],
    width: 'mid',
    zoom: 'fit',
    sel: null,        /* 当前选中的标注 id */
    dur: null,        /* 意见框正在编辑的标注 id */
    drawing: false,
    start: null,
    cur: null,
    pts: [],
    lastType: 'general'
  };

  /* ---------- 取值 / 换算 ---------- */
  function imgSize(doc) {
    doc = doc || STATE.doc;
    var im = doc && doc.image;
    return { w: (im && im.w) || 1, h: (im && im.h) || 1 };
  }
  function strokeBase(m) {
    var v = (IMG_WMAP[m.width] || IMG_WMAP.mid).v;
    return m.tool === 'highlight' ? v * 7 : v;
  }
  function anchorOf(m) {
    if (m.pts && m.pts.length) return { x: m.pts[0][0], y: m.pts[0][1] };
    if (m.tool === 'arrow') return { x: m.geo.x1, y: m.geo.y1 };
    return { x: m.geo.x0, y: m.geo.y0 };
  }
  /* 把归一化坐标翻译成人看得懂的方位，给侧栏卡片和导出清单用 */
  function locOf(m) {
    var a = anchorOf(m);
    var v = a.y < 0.34 ? '上' : (a.y < 0.67 ? '中' : '下');
    var h = a.x < 0.34 ? '左' : (a.x < 0.67 ? '中' : '右');
    if (v === '中' && h === '中') return '图片中央';
    if (h === '中') return '图' + v + '部';
    if (v === '中') return '图' + h + '部';
    return '图' + h + v;      /* 中文习惯是「左上」而不是「上左」 */
  }
  function toolLabel(k) { return (IMG_TOOL_MAP[k] || {}).label || '标注'; }
  function quoteOf(m) { return locOf(m) + ' · ' + toolLabel(m.tool); }
  function round4(v) { return Math.round(v * 10000) / 10000; }

  function imageMarks(doc) {
    doc = doc || STATE.doc;
    return (doc && doc.marks) || [];
  }
  /* 只有写了意见的标注才进清单、才编号；纯划线的图形不进 */
  function imageNoteMarks(doc) {
    doc = doc || STATE.doc;
    return imageMarks(doc).filter(function (m) {
      return (m.body && m.body.trim()) || (m.suggestion && m.suggestion.trim());
    }).sort(function (a, b) { return (a.seq || 0) - (b.seq || 0); });
  }
  function findMark(id) {
    var list = imageMarks();
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }

  function makeGrow() {
    var s = document.createElement('span');
    s.className = 'grow';
    return s;
  }

  function svgEl(tag, attrs) {    var el = document.createElementNS(SVGNS, tag);
    if (attrs) {
      for (var k in attrs) {
        if (Object.prototype.hasOwnProperty.call(attrs, k) && attrs[k] != null) {
          el.setAttribute(k, attrs[k]);
        }
      }
    }
    return el;
  }
  /* 画标注时 DRAW.pts 里存的是 {x,y} 对象；落库后 mark.pts 里存的是 [x,y] 数组。
     这里两种都要吃得下 —— 之前只认数组，导致拖拽中的预览线被算成 "NaN,NaN" 而看不见，
     只有松手落库后才显示，表现为「画笔不跟手」。 */
  function ptsAttr(pts, n) {
    return pts.map(function (p) {
      var x = (p && p.x != null) ? p.x : p[0];
      var y = (p && p.y != null) ? p.y : p[1];
      return (x * n.w).toFixed(1) + ',' + (y * n.h).toFixed(1);
    }).join(' ');
  }

  /* ---------- 标注 → SVG 图形（屏幕 / 导出共用同一套画法） ---------- */
  function markNode(m, numMap, n, S, live) {
    n = n || imgSize();
    S = S || Math.min(n.w, n.h);
    var sw = strokeBase(m) * S;
    var col = m.color || IMG_COLORS[0];
    var g = svgEl('g', {
      'data-mk': m.id,
      class: 'svg-hit' + (live && DRAW.sel === m.id ? ' is-sel' : '')
    });

    if (m.pts && m.pts.length) {
      g.appendChild(svgEl('polyline', {
        points: ptsAttr(m.pts, n),
        fill: 'none', stroke: col, 'stroke-width': sw,
        'stroke-linecap': 'round', 'stroke-linejoin': 'round',
        opacity: m.tool === 'highlight' ? 0.34 : 1
      }));
    } else if (m.tool === 'rect') {
      var bw = Math.abs(m.geo.x1 - m.geo.x0) * n.w;
      var bh = Math.abs(m.geo.y1 - m.geo.y0) * n.h;
      g.appendChild(svgEl('rect', {
        x: Math.min(m.geo.x0, m.geo.x1) * n.w,
        y: Math.min(m.geo.y0, m.geo.y1) * n.h,
        width: bw, height: bh,
        rx: Math.max(0, Math.min(n.w * 0.012, bw / 4, bh / 4)),
        fill: 'none', stroke: col, 'stroke-width': sw, 'stroke-linejoin': 'round'
      }));
    } else if (m.tool === 'highlight') {
      /* 高亮是「框选一块区域铺半透明底色」，不是描边，所以填色 + 极淡的边 */
      var hw = Math.abs(m.geo.x1 - m.geo.x0) * n.w;
      var hh = Math.abs(m.geo.y1 - m.geo.y0) * n.h;
      g.appendChild(svgEl('rect', {
        x: Math.min(m.geo.x0, m.geo.x1) * n.w,
        y: Math.min(m.geo.y0, m.geo.y1) * n.h,
        width: hw, height: hh,
        rx: Math.max(0, Math.min(n.w * 0.006, hw / 6, hh / 6)),
        fill: col, 'fill-opacity': 0.3,
        stroke: col, 'stroke-opacity': 0.5,
        'stroke-width': Math.max(1, S * 0.0035)
      }));
    } else if (m.tool === 'ellipse') {
      g.appendChild(svgEl('ellipse', {
        cx: (m.geo.x0 + m.geo.x1) / 2 * n.w,
        cy: (m.geo.y0 + m.geo.y1) / 2 * n.h,
        rx: Math.abs(m.geo.x1 - m.geo.x0) / 2 * n.w,
        ry: Math.abs(m.geo.y1 - m.geo.y0) / 2 * n.h,
        fill: 'none', stroke: col, 'stroke-width': sw
      }));
    } else if (m.tool === 'arrow') {
      appendArrow(g, m.geo.x0 * n.w, m.geo.y0 * n.h, m.geo.x1 * n.w, m.geo.y1 * n.h, sw, S, col);
    }

    var no = numMap && numMap[m.id];
    var a = anchorOf(m);
    var r = S * 0.026;

    if (m.tool === 'pin' && !no) {
      g.appendChild(svgEl('circle', {
        cx: a.x * n.w, cy: a.y * n.h, r: r * 0.55,
        fill: col, stroke: '#FFFFFF', 'stroke-width': r * 0.22
      }));
    }

    if (no) {
      var ox = -r * 0.8, oy = -r * 0.8;
      if (m.tool === 'arrow') { ox = r * 0.6; oy = -r * 0.6; }
      else if (m.tool === 'pin') { ox = 0; oy = 0; }
      var bx = Math.max(r * 1.05, Math.min(a.x * n.w + ox, n.w - r * 1.05));
      var by = Math.max(r * 1.05, Math.min(a.y * n.h + oy, n.h - r * 1.05));
      g.appendChild(svgEl('circle', {
        cx: bx, cy: by, r: r, fill: col, stroke: '#FFFFFF', 'stroke-width': r * 0.24
      }));
      var tx = svgEl('text', {
        x: bx, y: by, 'text-anchor': 'middle', 'dominant-baseline': 'central',
        'font-size': r * 1.18, 'font-weight': '700', fill: '#FFFFFF', 'font-family': 'sans-serif'
      });
      tx.textContent = String(no);
      g.appendChild(tx);
    }
    return g;
  }

  function appendArrow(g, x0, y0, x1, y1, sw, S, col) {
    var ang = Math.atan2(y1 - y0, x1 - x0);
    var head = Math.max(sw * 3.4, S * 0.018);
    var spread = 0.44;
    var hx1 = x1 - head * Math.cos(ang - spread);
    var hy1 = y1 - head * Math.sin(ang - spread);
    var hx2 = x1 - head * Math.cos(ang + spread);
    var hy2 = y1 - head * Math.sin(ang + spread);
    g.appendChild(svgEl('line', {
      x1: x0, y1: y0,
      x2: x1 - head * 0.66 * Math.cos(ang),
      y2: y1 - head * 0.66 * Math.sin(ang),
      stroke: col, 'stroke-width': sw, 'stroke-linecap': 'round'
    }));
    g.appendChild(svgEl('polygon', {
      points: x1 + ',' + y1 + ' ' + hx1 + ',' + hy1 + ' ' + hx2 + ',' + hy2,
      fill: col
    }));
  }

  /* ---------- 画布渲染 ---------- */
  function renderImgStage() {
    if (!STATE.doc || STATE.doc.kind !== 'image') {
      $('#imgStage').classList.add('hidden');
      return;
    }
    var hasImg = !!(STATE.doc.image && STATE.doc.image.dataUrl);
    var showDrop = !hasImg || STATE.mode === 'edit';
    var showImg = hasImg && STATE.mode !== 'edit';
    var toolsOn = hasImg && STATE.mode === 'annotate';

    $('#imgDrop').classList.toggle('hidden', !showDrop);
    $('#imgHolder').classList.toggle('hidden', !showImg);
    $('#imgTools').classList.toggle('hidden', !toolsOn);

    $('#imgDropTitle').textContent = hasImg ? '换一张截图' : '把 QQ 推送的截图放进来';
    $('#imgDropSub').textContent = hasImg
      ? '拖入或粘贴新图会替换当前截图，并清空已有标注'
      : '拖拽图片到这里 · 或直接 Ctrl + V 粘贴 · 或点下面按钮选择';
    $('#btnPickImg').textContent = hasImg ? '更换图片' : '选择图片';

    if (!showImg) { hideImgComposer(); return; }

    $('#stageImg').src = STATE.doc.image.dataUrl;
    var n = imgSize();
    var svg = $('#stageSvg');
    svg.setAttribute('viewBox', '0 0 ' + n.w + ' ' + n.h);
    svg.setAttribute('data-tool', STATE.mode === 'preview' ? 'select' : DRAW.tool);
    svg.classList.toggle('is-locked', STATE.mode === 'preview');

    fitHolder();
    renderImgTools();
    paintMarks();
  }

  function fitHolder() {
    if (!STATE.doc || !STATE.doc.image) return;
    var board = $('#imgBoard');
    var n = imgSize();
    var availW = Math.max(120, board.clientWidth - 32);
    var scale = DRAW.zoom === 'fit' ? Math.min(1, availW / n.w) : DRAW.zoom;
    $('#imgHolder').style.width = Math.round(n.w * scale) + 'px';
    $('#imgHolder').style.height = Math.round(n.h * scale) + 'px';
  }

  function paintMarks() {
    var svg = $('#stageSvg');
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    if (!STATE.doc || !STATE.doc.image) return;
    var numMap = {};
    imageNoteMarks().forEach(function (m, i) { numMap[m.id] = i + 1; });
    var n = imgSize(), S = Math.min(n.w, n.h);
    var g = svgEl('g', { id: 'svMarks' });
    imageMarks().forEach(function (m) { g.appendChild(markNode(m, numMap, n, S, true)); });
    svg.appendChild(g);
    svg.appendChild(svgEl('g', { id: 'svPreview' }));
  }

  function renderImgTools() {
    var box = $('#imgTools');
    if (!box) return;
    var h = '';

    h += '<div class="it-group"><span class="it-lab">工具</span>';
    IMG_TOOLS.forEach(function (t) {
      h += '<button type="button" class="it-btn' + (DRAW.tool === t.key ? ' is-on' : '') +
        '" data-tool="' + t.key + '" title="' + t.label + '">' +
        (ICON_BY_TOOL[t.key] || '') + '<span>' + t.label + '</span></button>';
    });
    h += '</div>';

    h += '<div class="it-group"><span class="it-lab">颜色</span>';
    IMG_COLORS.forEach(function (c) {
      h += '<button type="button" class="sw' + (DRAW.color === c ? ' is-on' : '') +
        '" data-color="' + c + '" style="background:' + c + '" title="' + c + '"></button>';
    });
    h += '<input type="color" class="it-color" id="imgColor" value="' + DRAW.color + '" title="自定义颜色">';
    h += '</div>';

    h += '<div class="it-group"><span class="it-lab">粗细</span>';
    IMG_WIDTHS.forEach(function (w) {
      h += '<button type="button" class="it-btn' + (DRAW.width === w.key ? ' is-on' : '') +
        '" data-width="' + w.key + '"><span>' + w.label + '</span></button>';
    });
    h += '</div>';

    var zoomOpt = function (v, label) {
      return '<option value="' + v + '"' +
        (String(DRAW.zoom) === v ? ' selected' : '') + '>' + label + '</option>';
    };
    h += '<div class="it-group">' +
      '<button type="button" class="it-btn" data-act="undo" title="撤销上一步 (Ctrl+Z)">' +
        ICONS.t_undo + '<span>撤销</span></button>' +
      '<button type="button" class="it-btn" data-act="clear" title="清空全部标注">' +
        ICONS.t_clear + '<span>清空</span></button>' +
      '<button type="button" class="it-btn" data-act="replace" title="换一张截图">' +
        ICONS.t_replace + '<span>换图</span></button>' +
      '<select id="imgZoom" class="mini-select" title="缩放">' +
        zoomOpt('fit', '适应宽度') + zoomOpt('0.5', '50%') +
        zoomOpt('1', '100%') + zoomOpt('1.5', '150%') +
      '</select>' +
      '</div>';

    box.innerHTML = h;
  }

  function syncSvgTool() {
    var svg = $('#stageSvg');
    if (svg) svg.setAttribute('data-tool', STATE.mode === 'preview' ? 'select' : DRAW.tool);
  }

  function onImgToolClick(e) {
    var t = e.target && e.target.closest ? e.target.closest('[data-tool]') : null;
    if (t) { DRAW.tool = t.dataset.tool; renderImgTools(); syncSvgTool(); return; }

    var c = e.target.closest ? e.target.closest('[data-color]') : null;
    if (c) { DRAW.color = c.dataset.color; renderImgTools(); return; }

    var w = e.target.closest ? e.target.closest('[data-width]') : null;
    if (w) { DRAW.width = w.dataset.width; renderImgTools(); return; }

    var a = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!a) return;
    var act = a.dataset.act;
    if (act === 'undo') undoMark();
    else if (act === 'clear') clearMarks();
    else if (act === 'replace') $('#imgFile').click();
  }

  /* ---------- 绘制交互 ---------- */
  function normFromEvent(e) {
    var r = $('#stageSvg').getBoundingClientRect();
    return {
      x: Math.max(0, Math.min(1, (e.clientX - r.left) / (r.width || 1))),
      y: Math.max(0, Math.min(1, (e.clientY - r.top) / (r.height || 1)))
    };
  }

  function onImgPointerDown(e) {
    if (!STATE.doc || STATE.doc.kind !== 'image') return;
    if (STATE.mode !== 'annotate') return;

    /* 意见框开着时先把话说完，避免手一抖把没保存的意见弄丢 */
    if (DRAW.dur) {
      if (imgComposerDirty()) { toast('先把意见保存，或按 Esc 取消'); return; }
      hideImgComposer();
    }

    if (DRAW.tool === 'select') {
      var hit = e.target && e.target.closest ? e.target.closest('[data-mk]') : null;
      if (hit) selectMark(hit.getAttribute('data-mk'));
      else hideImgComposer();
      return;
    }

    e.preventDefault();
    DRAW.drawing = true;
    DRAW.start = DRAW.cur = normFromEvent(e);
    DRAW.pts = [DRAW.start];
    try { $('#stageSvg').setPointerCapture(e.pointerId); } catch (err) {}
    paintPreview();
  }

  function onImgPointerMove(e) {
    if (!DRAW.drawing) return;
    var p = normFromEvent(e);
    DRAW.cur = p;
    if (DRAW.tool === 'pen') {
      var last = DRAW.pts[DRAW.pts.length - 1];
      if (!last || Math.abs(p.x - last.x) > 0.0022 || Math.abs(p.y - last.y) > 0.0022) {
        DRAW.pts.push(p);
      }
    }
    paintPreview();
  }

  function onImgPointerUp(e) {
    if (!DRAW.drawing) return;
    DRAW.drawing = false;
    try { $('#stageSvg').releasePointerCapture(e.pointerId); } catch (err) {}

    var m = markFromStroke();
    DRAW.start = DRAW.cur = null;
    DRAW.pts = [];
    var g = $('#svPreview');
    if (g) while (g.firstChild) g.removeChild(g.firstChild);
    if (!m) return;

    STATE.doc.marks = STATE.doc.marks || [];
    m.seq = STATE.doc.marks.length + 1;
    m.start = m.seq;
    m.end = m.seq;
    STATE.doc.marks.push(m);
    touch();
    paintMarks();

    /* 画完就弹意见框 —— 对每一种工具都一样，不再挑工具。 */
    openImgComposer(m.id, true);
  }

  function markFromStroke() {
    var t = DRAW.tool, s = DRAW.start, c = DRAW.cur;
    if (!s || !c) return null;

    var m = {
      id: uid('mk_'),
      tool: t,
      color: DRAW.color,
      width: DRAW.width,
      type: DRAW.lastType || 'general',
      body: '', suggestion: '',
      author: annotatorName(),
      resolved: false, lost: false,
      createdAt: Date.now()
    };

    if (t === 'pen') {
      if (DRAW.pts.length < 2) return null;
      m.pts = DRAW.pts.map(function (p) { return [round4(p.x), round4(p.y)]; });
    } else if (t === 'pin') {
      m.geo = { x0: round4(s.x), y0: round4(s.y), x1: round4(s.x), y1: round4(s.y) };
    } else {
      if (Math.abs(c.x - s.x) < 0.012 && Math.abs(c.y - s.y) < 0.012) return null;
      if (t === 'arrow') {
        m.geo = { x0: round4(s.x), y0: round4(s.y), x1: round4(c.x), y1: round4(c.y) };
      } else {
        /* 方框 / 圆圈 / 高亮框：都存成「左上角 + 一点」的规范对角 */
        m.geo = {
          x0: round4(Math.min(s.x, c.x)), y0: round4(Math.min(s.y, c.y)),
          x1: round4(Math.max(s.x, c.x)), y1: round4(Math.max(s.y, c.y))
        };
      }
    }
    m.quote = quoteOf(m);
    return m;
  }

  function paintPreview() {
    var g = $('#svPreview');
    if (!g) return;
    while (g.firstChild) g.removeChild(g.firstChild);
    if (!DRAW.drawing || !DRAW.start) return;

    var n = imgSize(), S = Math.min(n.w, n.h);
    var sw = strokeBase({ tool: DRAW.tool, width: DRAW.width }) * S;
    var col = DRAW.color;

    if (DRAW.tool === 'pen') {
      if (DRAW.pts.length < 2) { paintTip(g, n, S, col); return; }
      g.appendChild(svgEl('polyline', {
        points: ptsAttr(DRAW.pts, n), fill: 'none', stroke: col,
        'stroke-width': sw, 'stroke-linecap': 'round', 'stroke-linejoin': 'round',
        opacity: 0.92
      }));
      paintTip(g, n, S, col);
      return;
    }

    var s = DRAW.start, c = DRAW.cur;
    var dash = (sw * 1.9).toFixed(1) + ' ' + (sw * 1.5).toFixed(1);
    if (DRAW.tool === 'rect') {
      g.appendChild(svgEl('rect', {
        x: Math.min(s.x, c.x) * n.w, y: Math.min(s.y, c.y) * n.h,
        width: Math.abs(c.x - s.x) * n.w, height: Math.abs(c.y - s.y) * n.h,
        fill: 'none', stroke: col, 'stroke-width': sw, 'stroke-dasharray': dash
      }));
    } else if (DRAW.tool === 'highlight') {
      g.appendChild(svgEl('rect', {
        x: Math.min(s.x, c.x) * n.w, y: Math.min(s.y, c.y) * n.h,
        width: Math.abs(c.x - s.x) * n.w, height: Math.abs(c.y - s.y) * n.h,
        fill: col, 'fill-opacity': 0.26,
        stroke: col, 'stroke-dasharray': dash,
        'stroke-width': Math.max(1, S * 0.0035)
      }));
    } else if (DRAW.tool === 'ellipse') {
      g.appendChild(svgEl('ellipse', {
        cx: (s.x + c.x) / 2 * n.w, cy: (s.y + c.y) / 2 * n.h,
        rx: Math.abs(c.x - s.x) / 2 * n.w, ry: Math.abs(c.y - s.y) / 2 * n.h,
        fill: 'none', stroke: col, 'stroke-width': sw, 'stroke-dasharray': dash
      }));
    } else if (DRAW.tool === 'arrow') {
      appendArrow(g, s.x * n.w, s.y * n.h, c.x * n.w, c.y * n.h, sw, S, col);
    } else if (DRAW.tool === 'pin') {
      g.appendChild(svgEl('circle', {
        cx: c.x * n.w, cy: c.y * n.h, r: S * 0.016,
        fill: 'none', stroke: col, 'stroke-width': sw, 'stroke-dasharray': dash
      }));
    }
    paintTip(g, n, S, col);
  }

  /* 笔尖小圆点：跟着光标走，让「画到哪了」一眼可见 */
  function paintTip(g, n, S, col) {
    var c = DRAW.cur;
    if (!c) return;
    g.appendChild(svgEl('circle', {
      cx: c.x * n.w, cy: c.y * n.h, r: Math.max(2, S * 0.011),
      fill: col, stroke: '#FFFFFF', 'stroke-width': Math.max(1, S * 0.004)
    }));
  }

  function selectMark(id) {
    if (!findMark(id)) return;
    openImgComposer(id, false);
  }

  function undoMark() {
    var list = imageMarks();
    if (!list.length) { toast('没有可撤销的标注'); return; }
    list.pop();
    STATE.doc.marks = list;
    hideImgComposer();
    touch();
    paintMarks();
    renderSidebar();
    toast('已撤销上一步');
  }

  function clearMarks() {
    if (!imageMarks().length) { toast('这张图上还没有标注'); return; }
    ask({
      title: '清空全部标注',
      msg: '这张图上的 ' + imageMarks().length + ' 个标注会全部删除，无法撤销。',
      actions: [
        { label: '清空', value: 'yes', kind: 'destructive' },
        { label: '取消', value: 'no', kind: 'ghost' }
      ]
    }).then(function (r) {
      if (r.act !== 'yes') return;
      STATE.doc.marks = [];
      hideImgComposer();
      touch();
      paintMarks();
      renderSidebar();
    });
  }

  function deleteMark(id) {
    ask({
      title: '删除这个标注',
      actions: [
        { label: '删除', value: 'yes', kind: 'destructive' },
        { label: '取消', value: 'no', kind: 'ghost' }
      ]
    }).then(function (r) {
      if (r.act !== 'yes') return;
      STATE.doc.marks = imageMarks().filter(function (m) { return m.id !== id; });
      hideImgComposer();
      touch();
      paintMarks();
      renderSidebar();
    });
  }

  function scrollMarkIntoView(m) {
    var svg = $('#stageSvg'), board = $('#imgBoard');
    if (!svg || !board) return;
    var r = svg.getBoundingClientRect(), br = board.getBoundingClientRect();
    var a = anchorOf(m);
    var y = (r.top - br.top) + a.y * r.height + board.scrollTop;
    board.scrollTo({ top: Math.max(0, y - board.clientHeight / 2), behavior: 'smooth' });
  }

  /* ---------- 意见框 ---------- */
  function positionImgComposer(m) {
    var box = $('#imgComposer');
    var r = $('#stageSvg').getBoundingClientRect();
    var a = anchorOf(m);
    var cx = r.left + a.x * r.width;
    var cy = r.top + a.y * r.height;
    box.style.left = '0px';
    box.style.top = '0px';
    setTimeout(function () {
      var bw = box.offsetWidth || 440, bh = box.offsetHeight || 240;
      var left = cx - bw / 2;
      var top = cy + 18;
      if (top + bh > window.innerHeight - 10) top = cy - bh - 18;
      left = Math.max(10, Math.min(left, window.innerWidth - bw - 10));
      top = Math.max(8, Math.min(top, window.innerHeight - bh - 10));
      box.style.left = left + 'px';
      box.style.top = top + 'px';
    }, 0);
  }

  function openImgComposer(markId, isNew) {
    var m = findMark(markId);
    if (!m) return;
    DRAW.dur = markId;
    DRAW.sel = markId;
    paintMarks();

    var box = $('#imgComposer');
    box.classList.remove('hidden');
    box.innerHTML = '';
    box.dataset.pickedType = m.type || 'general';

    var wrap = document.createElement('div');
    wrap.className = 'composer';

    var quote = document.createElement('div');
    quote.className = 'composer-quote';
    quote.textContent = quoteOf(m);
    wrap.appendChild(quote);

    var typeRow = document.createElement('div');
    typeRow.className = 'chips';
    TYPES.forEach(function (t) {
      var c = document.createElement('button');
      c.type = 'button';
      c.className = 'chip';
      c.dataset.type = t.key;
      c.textContent = t.label;
      paintChip(c, t, m.type === t.key);
      typeRow.appendChild(c);
    });
    wrap.appendChild(typeRow);

    var ta = document.createElement('textarea');
    ta.placeholder = '这个位置要改什么？（Ctrl + Enter 保存，Esc 取消）';
    ta.value = m.body || '';
    wrap.appendChild(ta);

    var input = document.createElement('input');
    input.type = 'text';
    input.placeholder = '建议改成什么（可留空）';
    input.value = m.suggestion || '';
    wrap.appendChild(input);

    var actions = document.createElement('div');
    actions.className = 'composer-actions';

    if (!isNew) {
      var del = document.createElement('button');
      del.className = 'btn-sm';
      del.type = 'button';
      del.textContent = '删除标注';
      del.addEventListener('click', function () { deleteMark(markId); });
      actions.appendChild(del);
    }
    actions.appendChild(makeGrow());

    var cancel = document.createElement('button');
    cancel.className = 'btn-sm';
    cancel.type = 'button';
    cancel.textContent = isNew ? '只保留图形' : '取消';
    cancel.addEventListener('click', hideImgComposer);

    var submit = document.createElement('button');
    submit.className = 'btn-sm primary';
    submit.type = 'button';
    submit.textContent = '保存批注';
    submit.addEventListener('click', function () { commitImgComposer(markId); });

    actions.appendChild(cancel);
    actions.appendChild(submit);
    wrap.appendChild(actions);
    box.appendChild(wrap);

    typeRow.addEventListener('click', function (ev) {
      var b = ev.target.closest ? ev.target.closest('[data-type]') : null;
      if (!b) return;
      box.dataset.pickedType = b.dataset.type;
      Array.prototype.forEach.call(typeRow.children, function (ch) {
        paintChip(ch, TYPE_MAP[ch.dataset.type], ch === b);
      });
    });

    var onKey = function (ev) {
      if ((ev.ctrlKey || ev.metaKey) && ev.key === 'Enter') { ev.preventDefault(); submit.click(); }
      if (ev.key === 'Escape') { ev.stopPropagation(); hideImgComposer(); }
    };
    ta.addEventListener('keydown', onKey);
    input.addEventListener('keydown', onKey);

    positionImgComposer(m);
    setTimeout(function () {
      ta.focus();
      ta.selectionStart = ta.selectionEnd = ta.value.length;
    }, 0);
  }

  function paintChip(el, t, on) {
    if (!t) return;
    el.classList.toggle('is-on', !!on);
    /* 只驱动 currentColor，边框和文字一起跟着走；底色交给主题 */
    el.style.color = on ? t.dot : '';
  }

  function imgComposerDirty() {
    if (!DRAW.dur) return false;
    var m = findMark(DRAW.dur);
    if (!m) return false;
    var box = $('#imgComposer');
    var ta = box.querySelector('textarea');
    if (!ta) return false;
    var inp = box.querySelector('input[type="text"]');
    return ta.value.trim() !== (m.body || '').trim() ||
           (inp ? inp.value.trim() : '') !== (m.suggestion || '').trim();
  }

  function commitImgComposer(id) {
    var m = findMark(id);
    if (!m) return;
    var box = $('#imgComposer');
    var ta = box.querySelector('textarea');
    if (!ta) return;
    var inp = box.querySelector('input[type="text"]');
    var body = ta.value.trim();
    var sug = inp ? inp.value.trim() : '';
    if (!body && !sug) {
      toast('至少写一句意见；只想留图形就点「只保留图形」');
      ta.focus();
      return;
    }
    m.body = body;
    m.suggestion = sug;
    m.type = box.dataset.pickedType || m.type;
    m.quote = quoteOf(m);
    if (!m.author) m.author = annotatorName();
    DRAW.lastType = m.type;
    DRAW.dur = null;
    DRAW.sel = null;
    box.classList.add('hidden');
    box.innerHTML = '';
    touch();
    paintMarks();
    renderSidebar();
    toast('批注已保存');
  }

  function hideImgComposer() {
    var box = $('#imgComposer');
    if (!box) return;
    if (!box.classList.contains('hidden')) {
      box.classList.add('hidden');
      box.innerHTML = '';
    }
    DRAW.dur = null;
    DRAW.sel = null;
    paintMarks();
  }

  /* ---------- 导入图片 ---------- */
  function imageFromClipboard(cd) {
    if (!cd) return null;
    var items = cd.items || [];
    for (var i = 0; i < items.length; i++) {
      if (items[i].kind === 'file' && /^image\//.test(items[i].type)) {
        var f = items[i].getAsFile();
        if (f) return f;
      }
    }
    var files = cd.files || [];
    for (var j = 0; j < files.length; j++) {
      if (/^image\//.test(files[j].type)) return files[j];
    }
    return null;
  }

  /* 把图片压到 localStorage 放得下的体积。
     localStorage 按「字符数」吃配额，一个字符约占 2 字节，
     所以 base64 长度必须卡住预算，否则几张图就把 5MB 撑爆。 */
  function intakeImage(file) {
    return new Promise(function (resolve) {
      var url = URL.createObjectURL(file);
      var im = new Image();
      im.onload = function () {
        URL.revokeObjectURL(url);
        var W = im.naturalWidth, H = im.naturalHeight;
        if (!W || !H) { resolve(null); return; }

        var tiers = [
          { max: IMG_MAX_DIM, q: 0.92 },
          { max: 1180, q: 0.88 },
          { max: 940, q: 0.84 }
        ];
        var best = null;
        for (var i = 0; i < tiers.length; i++) {
          var t = tiers[i];
          var s = Math.min(1, t.max / Math.max(W, H));
          var w = Math.max(1, Math.round(W * s));
          var h = Math.max(1, Math.round(H * s));
          var c = document.createElement('canvas');
          c.width = w; c.height = h;
          var ctx = c.getContext('2d');
          ctx.fillStyle = '#FFFFFF';
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(im, 0, 0, w, h);

          var jpg = c.toDataURL('image/jpeg', t.q);
          var cand = { d: jpg, m: 'image/jpeg' };
          /* 只在 JPEG 已经足够小的时候才试 PNG——
             截图是纯色块，PNG 往往更锐利；但体积超标时它比 JPEG 大得多，
             所以没必要为必然被淘汰的候选付一次全图编码的开销。 */
          if (jpg.length <= IMG_BUDGET * 0.7) {
            var png = c.toDataURL('image/png');
            if (png.length < jpg.length) cand = { d: png, m: 'image/png' };
          }
          var entry = { d: cand.d, m: cand.m, w: w, h: h };
          if (!best || entry.d.length < best.d.length) best = entry;
          if (entry.d.length <= IMG_BUDGET) { best = entry; break; }
        }
        resolve({
          dataUrl: best.d, mime: best.m, w: best.w, h: best.h, chars: best.d.length
        });
      };
      im.onerror = function () { URL.revokeObjectURL(url); resolve(null); };
      im.src = url;
    });
  }

  function fileTitle(file) {
    var n = ((file && file.name) || '').replace(/\.[^.]+$/, '').trim();
    return n || '未命名图片批改';
  }

  function importImage(file) {
    if (!file) return;
    if (!/^image\//.test(file.type || '')) { toast('只支持图片文件'); return; }

    /* 换图会清掉全部标注，且不可撤销。
       确认必须放在这里而不是按钮上——拖拽和 Ctrl+V 也走同一条路，
       否则这两条入口就成了静默丢标注的暗道。 */
    var existing = imageMarks().length;
    var replacing = !!(STATE.doc && STATE.doc.kind === 'image' &&
                      STATE.doc.image && STATE.doc.image.dataUrl && existing);
    if (!replacing) { doImport(file); return; }
    ask({
      title: '换一张图',
      msg: '换新图会清空已有的 ' + existing + ' 个标注，且无法撤销。',
      actions: [
        { label: '继续换图', value: 'yes', kind: 'destructive' },
        { label: '取消', value: 'no', kind: 'ghost' }
      ]
    }).then(function (r) { if (r.act === 'yes') doImport(file); });
  }

  /* 图片一读进来就立刻写盘，不等「保存」：
     截图动辄几百 KB，忘点保存就白干一场太亏；
     而且配额够不够也要当场告诉用户。之后新增的标注才走手动保存。 */
  function doImport(file) {
    toast('正在处理截图…');

    intakeImage(file).then(function (res) {
      if (!res) { toast('图片读取失败，换个格式或重新截一次'); return; }

      var target = (STATE.doc && STATE.doc.kind === 'image') ? STATE.doc : null;
      if (!target) {
        target = newImageDoc(fileTitle(file));
        STATE.doc = target;
        STATE.focusAnnId = null;
      } else if (target.image) {
        target.marks = [];
      }
      if (!target.title || /^(未命名图片批改|未命名推送)$/.test(target.title)) {
        target.title = fileTitle(file);
      }
      target.image = { dataUrl: res.dataUrl, w: res.w, h: res.h, mime: res.mime };
      target.marks = target.marks || [];
      target.updatedAt = Date.now();
      STATE.mode = 'annotate';
      hideImgComposer();

      var saved = store.setDoc(target);
      syncIndexEntry();
      $('#docTitle').value = target.title;
      setDirty(!saved);        /* 图已落盘 → 干净；配额写不进去 → 保持待保存 */
      renderAll();

      if (!saved) toast('本地存储放不下这张图：先用「导出 JSON 存档」备份，再删掉旧文档');
      else toast('图片就绪（' + res.w + '×' + res.h + '）· 选个工具圈起来吧');
    });
  }

  /* ============================================================
   * 13. 导出
   * ============================================================ */
  function exportAnnList(doc) {
    var anns = doc.kind === 'image'
      ? imageNoteMarks(doc)
      : doc.annotations.filter(function (a) { return !a.lost; })
          .sort(function (a, b) { return a.start - b.start || a.end - b.end; });
    anns.forEach(function (a, i) { a._n = i + 1; });
    return anns;
  }

  /* 导出菜单随文档类型变化：文字文档关心「意见怎么排」，
     图片文档关心「要不要连意见清单一起来」。 */
  function renderExportMenu() {
    var box = $('#exportMenu');
    if (!box) return;

        '<div class="menu-group">索引式（引线指向）</div>' +

        mi('imgdoc-near', ICONS.link, '长图 · 就近索引（贴图）') +
        '<div class="menu-group">打印</div>' +
        mi('imgdoc-pdf', ICONS.printer, '打印 / 存为 PDF') +
