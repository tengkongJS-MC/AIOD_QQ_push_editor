  /* 导出稿是独立文件，样式必须自带（不依赖主界面的 CSS）。
     排版取向跟主界面一致：苹果式克制——系统字体、留白分层、
     发丝线、多层柔和阴影，正文 17px 便于手机上阅读。 */
  function styleBlock() {
    return [
      '*{box-sizing:border-box}',
      'body{margin:0;background:#F2F2F7;color:#1C1C1E;',
      'font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",',
      '"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;',
      'letter-spacing:-.01em;-webkit-font-smoothing:antialiased;}',
      '.page{max-width:800px;margin:0 auto;background:#FFFFFF;padding:48px 52px 56px;}',
      '.hd{border-bottom:1px solid rgba(60,60,67,.20);padding-bottom:18px;margin-bottom:28px;}',
      '.hd .kicker{font-size:12px;letter-spacing:.12em;color:#007AFF;font-weight:600;margin-bottom:8px;}',
      '.hd h1{font-size:26px;line-height:1.25;margin:0 0 12px;font-weight:700;letter-spacing:-.02em;}',
      '.hd .meta{font-size:13px;color:#8E8E93;display:flex;gap:18px;flex-wrap:wrap;font-variant-numeric:tabular-nums;}',
      '.body{font-size:17px;line-height:1.8;white-space:pre-wrap;word-break:break-word;}',
      '.em{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;font-size:1.15em;}',
      '.mk{border-radius:4px;padding:2px 1px;}',
      '.mk-typo{background:rgba(255,59,48,.12);border-bottom:2px solid #FF3B30;}',
      '.mk-wording{background:rgba(255,149,0,.15);border-bottom:2px solid #FF9500;}',
      '.mk-format{background:rgba(175,82,222,.12);border-bottom:2px solid #AF52DE;}',
      '.mk-emoji{background:rgba(50,173,230,.14);border-bottom:2px solid #32ADE6;}',
      '.mk-praise{background:rgba(52,199,89,.13);border-bottom:2px solid #34C759;}',
      '.mk-general{background:rgba(142,142,147,.13);border-bottom:2px solid #8E8E93;}',
      '.num{font-size:.62em;font-weight:700;color:#007AFF;vertical-align:super;margin-left:2px;}',
      '.notes{margin-top:36px;border-top:1px solid rgba(60,60,67,.20);padding-top:24px;}',
      '.notes-title{font-size:13px;font-weight:600;color:#8E8E93;letter-spacing:.06em;',
      'text-transform:uppercase;margin-bottom:18px;}',
      '.note{display:flex;gap:12px;margin-bottom:18px;break-inside:avoid;page-break-inside:avoid;}',
      '.note .no{flex:none;width:22px;height:22px;border-radius:50%;background:#007AFF;color:#fff;',
      'font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;margin-top:2px;',
      'font-variant-numeric:tabular-nums;}',
      '.note-main{flex:1;min-width:0;}',
      '.note-head{font-size:13px;font-weight:600;margin-bottom:5px;}',
      '.note-quote{font-size:13px;color:#8E8E93;margin-bottom:6px;word-break:break-word;}',
      '.note-body{font-size:14.5px;line-height:1.65;}',
      '.note-sug{margin-top:8px;font-size:14px;background:rgba(52,199,89,.13);color:#1B7A34;',
      'border-radius:8px;padding:7px 11px;word-break:break-word;}',
      '.pblock{margin-bottom:24px;break-inside:avoid;page-break-inside:avoid;}',
      '.pblock .p{font-size:17px;line-height:1.8;white-space:pre-wrap;word-break:break-word;}',
      '.pblock .pnotes{margin-top:10px;padding-left:15px;border-left:2px solid rgba(60,60,67,.20);}',
      '.pnote{font-size:14px;line-height:1.65;margin-bottom:10px;}',
      '.pnote .tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;',
      'border-radius:999px;margin-right:8px;vertical-align:1px;}',
      '.ft{margin-top:38px;padding-top:16px;border-top:1px solid rgba(60,60,67,.20);',
      'font-size:12px;color:#8E8E93;text-align:center;line-height:1.8;}',
      '@media print{body{background:#fff;}.page{max-width:none;padding:0;}}',
      '@page{size:A4;margin:16mm;}'
    ].join('');
  }

  function tagStyle(type) {
    var m = {
      typo: '#D70015|rgba(255,59,48,.12)', wording: '#A35B00|rgba(255,149,0,.15)',
      format: '#8E3FB8|rgba(175,82,222,.12)', emoji: '#0B6E96|rgba(50,173,230,.14)',
      praise: '#1B7A34|rgba(52,199,89,.13)', general: '#6C6C70|rgba(142,142,147,.13)'
    };
    var p = (m[type] || m.general).split('|');
    return 'color:' + p[0] + ';background:' + p[1] + ';';
  }

  function buildPlanFor(doc, from, to) {
    var anns = doc.annotations.filter(function (a) { return !a.lost; });
    var tokens = lex(doc.raw);
    return buildRenderPlan(doc.raw, tokens, anns, from, to);
  }

  function renderSegmentsHTML(plan, annMap, opts) {
    opts = opts || {};
    var html = '';
    var endsAt = {};
    if (opts.markerEnds) {
      opts.markerEnds.forEach(function (a) {
        (endsAt[a.end] = endsAt[a.end] || []).push(a);
      });
    }
    plan.forEach(function (seg) {
      var inner = seg.emoji
        ? '<span class="em">' + escapeHTML(seg.emoji) + '</span>'
        : escapeHTML(seg.text);

      if (seg.covers.length) {
        var dom = dominantAnn(seg.covers, annMap);
        var cls = dom ? 'mk mk-' + dom.type : 'mk mk-general';
        inner = '<span class="' + cls + '">' + inner + '</span>';
      }
      html += inner;

      if (opts.markerEnds && endsAt[seg.end]) {
        endsAt[seg.end].forEach(function (a) { html += '<sup class="num">' + a._n + '</sup>'; });
      }
    });
    return html;
  }

  function buildExportHTML(doc, style) {
    var anns = exportAnnList(doc);
    var annMap = {};
    anns.forEach(function (a) { annMap[a.id] = a; });

    var who = annotatorName();
    var head =
      '<div class="hd">' +
        '<div class="kicker">团委组织部 · QQ 推送批改稿</div>' +
        '<h1>' + escapeHTML(doc.title || '未命名推送') + '</h1>' +
        '<div class="meta">' +
          '<span>审查日期：' + fmtDate(Date.now()) + '</span>' +
          (who ? '<span>批注人：' + escapeHTML(who) + '</span>' : '') +
          '<span>共 ' + anns.length + ' 条意见</span>' +
          '<span>已解决 ' + doc.annotations.filter(function (a) { return a.resolved; }).length + ' 条</span>' +
        '</div>' +
      '</div>';

    var bodyHTML = '';

    if (style === 'inline') {
      var lines = [];
      var re = /[^\n]*/g, mm;
      while ((mm = re.exec(doc.raw)) !== null) {
        if (mm[0].length === 0 && mm.index === doc.raw.length) break;
        lines.push({ start: mm.index, end: mm.index + mm[0].length });
        if (re.lastIndex === mm.index) re.lastIndex++;
      }
      lines.forEach(function (ln) {
        var text = doc.raw.slice(ln.start, ln.end);
        if (!text.trim()) { bodyHTML += '<div class="pblock" style="margin-bottom:10px;"></div>'; return; }
        var plan = buildPlanFor(doc, ln.start, ln.end);
        var pHTML = renderSegmentsHTML(plan, annMap, {});
        var inLine = anns.filter(function (a) {
          return a.start >= ln.start && a.start < ln.end;
        });
        var notes = inLine.map(function (a) {
          var t = TYPE_MAP[a.type] || TYPE_MAP.general;
          return '<div class="pnote"><span class="tag" style="' + tagStyle(a.type) + '">' + t.label +
            '</span>' + escapeHTML(a.body || '') +
            (a.suggestion ? '<div class="note-sug">建议改为：' + escapeHTML(a.suggestion) + '</div>' : '') +
            '</div>';
        }).join('');
        bodyHTML += '<div class="pblock"><div class="p">' + pHTML + '</div>' +
          (notes ? '<div class="pnotes">' + notes + '</div>' : '') + '</div>';
      });
    } else {
      var plan = buildPlanFor(doc, 0, doc.raw.length);
      bodyHTML = '<div class="body">' + renderSegmentsHTML(plan, annMap, { markerEnds: anns }) + '</div>';
    }

    var notes = anns.map(function (a) {
      var t = TYPE_MAP[a.type] || TYPE_MAP.general;
      return '<div class="note">' +
        '<div class="no">' + a._n + '</div>' +
        '<div class="note-main">' +
          '<div class="note-head" style="' + tagStyle(a.type) + 'display:inline-block;padding:2px 9px;border-radius:10px;">' +
            t.label + '</div>' +
          '<div class="note-quote" style="margin-top:6px;">原文：' +
            escapeHTML(a.quote.length > 80 ? a.quote.slice(0, 80) + '…' : a.quote) + '</div>' +
          '<div class="note-body">' + escapeHTML(a.body || '').replace(/\n/g, '<br>') + '</div>' +
          (a.suggestion ? '<div class="note-sug">建议改为：' + escapeHTML(a.suggestion) + '</div>' : '') +
        '</div>' +
      '</div>';
    }).join('');

    var foot = '<div class="ft">本批改稿由「QQ 推送批改助手」生成 · ' + fmtTime(Date.now()) + '<br>' +
      '表情以通用 emoji 近似显示，实际发布时请以 QQ 客户端渲染为准</div>';

    /* 段后批注式已经在每个段落下面跟了意见，再在文末重复列一遍纯属噪音，
       所以只在「编号清单式」下输出文末汇总。 */
    var showNotes = style !== 'inline' && anns.length > 0;

    return '<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">' +
      '<meta name="viewport" content="width=device-width, initial-scale=1">' +
      '<title>批改稿 · ' + escapeHTML(doc.title || '') + '</title>' +
      '<style>' + styleBlock() + '</style></head><body>' +
      '<div class="page">' + head + bodyHTML +
      (showNotes ? '<div class="notes"><div class="notes-title">修改意见</div>' + notes + '</div>' : '') +
      foot + '</div></body></html>';
  }

  function download(filename, content, mime) {
    var blob = new Blob([content], { type: mime || 'text/plain;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }

  function safeName() {
    return (STATE.doc.title || '推送批改稿').replace(/[\\/:*?"<>|]/g, '_').slice(0, 40);
  }

  function exportHTML(style) {
    var html = buildExportHTML(STATE.doc, style);
    download(safeName() + '_批改稿.html', html, 'text/html;charset=utf-8');
    toast('批改稿已下载');
  }

  /* style: 'list' = 整体批注式（文末汇总编号清单）
            'inline' = 段后批注式（每段下面跟着意见，手机上更好读） */
  function exportPDF(style) {
    if (!STATE.doc) return;
    if (STATE.doc.kind === 'image') { exportImageDocPDF(); return; }
    var html = buildExportHTML(STATE.doc, style || 'list');
    var w = window.open('', '_blank');
    if (!w) { toast('浏览器拦截了新窗口，请允许弹窗后重试'); return; }
    w.document.open();
    w.document.write(html);
    w.document.close();
    setTimeout(function () { try { w.focus(); w.print(); } catch (e) {} }, 420);
  }

  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = src;
      s.onload = resolve;
      s.onerror = function () { reject(new Error('load fail')); };
      document.head.appendChild(s);
    });
  }

  function exportImage(style) {
    if (!STATE.doc) return;
    if (STATE.doc.kind === 'image') { exportImageDoc(true); return; }
    var html = buildExportHTML(STATE.doc, style || 'list');
    var box = document.createElement('div');
    box.style.cssText = 'position:fixed;left:-99999px;top:0;width:800px;background:#fff;';
    var iframe = document.createElement('iframe');
    iframe.style.cssText = 'width:800px;height:100px;border:0;';
    box.appendChild(iframe);
    document.body.appendChild(box);

    function done() {
      if (box.parentNode) box.parentNode.removeChild(box);
    }

    loadScript('https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js')
      .then(function () {
        iframe.srcdoc = html;
        iframe.onload = function () {
          setTimeout(function () {
            var target = iframe.contentDocument.querySelector('.page');
            if (!window.htmlToImage || !target) { toast('长图导出失败，请改用 PDF 或 HTML'); done(); return; }
            window.htmlToImage.toPng(target, { pixelRatio: 2, backgroundColor: '#ffffff' })
              .then(function (dataUrl) {
                var a = document.createElement('a');
                a.href = dataUrl;
                a.download = safeName() + '_批改稿.png';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                done();
                toast('长图已下载');
              })
              .catch(function () { toast('长图导出失败，请改用 PDF'); done(); });
          }, 320);
        };
      })
      .catch(function () {
        toast('当前网络无法加载长图组件，请改用 PDF 或 HTML 导出');
        done();
      });
  }

  /* ============================================================
   * 13.5 图片批改导出
   *   套路：原图铺底 → 标注层（复用同一套 SVG 画法）叠上去 → 需要时在图下接一条意见清单。
   *   把 SVG 序列化后当图片画进 canvas，是为了让导出和屏幕上的画法完全一致，
   *   否则就得把每种图形在 canvas 上重写一遍，迟早会画得不一样。
   * ============================================================ */
  function buildMarksSVG(W, H, numMap) {
    var svg = svgEl('svg', {
      xmlns: SVGNS, width: W, height: H, viewBox: '0 0 ' + W + ' ' + H
    });
    var g = svgEl('g', {});
    imageMarks().forEach(function (m) {
      g.appendChild(markNode(m, numMap, { w: W, h: H }, Math.min(W, H), false));
    });
    svg.appendChild(g);
    return svg;
  }

  function wrapText(ctx, text, maxW) {
    var out = [];
    String(text == null ? '' : text).split('\n').forEach(function (para) {
      if (!para) { out.push(''); return; }
      var line = '';
      for (var i = 0; i < para.length; i++) {
        var ch = para.charAt(i);
        if (line && ctx.measureText(line + ch).width > maxW) { out.push(line); line = ch; }
        else line += ch;
      }
      out.push(line);
    });
    return out;
  }

  /* 单条意见占的高度。量算总高和实际绘制共用这一个公式，
     否则「算出来的画布高度」和「画上去的内容」迟早会对不上——
     表现为最后一条被裁掉，或者底下留一大片空白。 */
  function noteRowHeight(nf, lh, nLines, nSug) {
    var head = Math.round(nf * 1.0);                          /* 类型行基线 */
    var bodyTop = Math.round(nf * 2.4);                       /* 正文首行基线 */
    var lastBase = nLines ? (bodyTop + (nLines - 1) * lh) : head;
    var bottom = lastBase + Math.round(nf * 0.5);
    if (nSug) bottom += (nSug - 1) * lh + Math.round(nf * 1.62);
    return bottom + Math.round(nf * 1.3);                     /* 行间距 */
  }

  function roundRectPath(ctx, x, y, w, h, r) {    r = Math.max(0, Math.min(r, w / 2, h / 2));
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function buildDocCanvas(withNotes) {
    return new Promise(function (resolve, reject) {
      var doc = STATE.doc;
      if (!doc || !doc.image) { reject(new Error('no image')); return; }

      var W = doc.image.w, H = doc.image.h;
      var notes = exportAnnList(doc);
      var numMap = {};
      notes.forEach(function (a) { numMap[a.id] = a._n; });

      /* 意见区字号跟着图片宽度走，否则在小图上会大得离谱、在大图上小得看不清 */
      var f = Math.max(1, W / 760);
      var nf = Math.round(15 * f);
      var lh = Math.round(nf * 1.72);
      var padX = Math.round(30 * f);
      var badgeR = Math.round(nf * 0.78);
      var textX = padX + badgeR * 2 + Math.round(nf * 0.6);
      var bodyW = Math.max(60, W - textX - padX);

      var measure = document.createElement('canvas').getContext('2d');
      measure.font = '400 ' + nf + 'px ' + CANVAS_FONT;

      var rows = notes.map(function (a) {
        var body = (a.body || '').trim();
        var lines = body ? wrapText(measure, body, bodyW) : [];
        var sug = a.suggestion ? wrapText(measure, a.suggestion, bodyW) : [];
        return {
          a: a, lines: lines, sug: sug,
          h: noteRowHeight(nf, lh, lines.length, sug.length)
        };
      });

      var areaH = 0;
      if (withNotes && rows.length) {
        areaH = Math.round(nf * 4.4) +
          rows.reduce(function (s, r) { return s + r.h; }, 0) +
          Math.round(nf * 0.8);
      }

      var canvas = document.createElement('canvas');
      canvas.width = W;
      canvas.height = H + areaH;
      var ctx = canvas.getContext('2d');
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      var photo = new Image();
      photo.onload = function () {
        ctx.drawImage(photo, 0, 0, W, H);

        var layer = buildMarksSVG(W, H, numMap);
        var str = new XMLSerializer().serializeToString(layer);
        var svgImg = new Image();
        var finish = function () {
          if (areaH) drawNotesPanel(ctx, W, H, areaH, rows, nf, lh, padX, badgeR, textX);
          resolve(canvas);
        };
        svgImg.onload = function () { ctx.drawImage(svgImg, 0, 0, W, H); finish(); };
        svgImg.onerror = finish;
        svgImg.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(str);
      };
      photo.onerror = function () { reject(new Error('photo load fail')); };
      photo.src = doc.image.dataUrl;
    });
  }

  function drawNotesPanel(ctx, W, H, areaH, rows, nf, lh, padX, badgeR, textX) {
    var top0 = H;
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0, top0, W, areaH);
    ctx.fillStyle = '#007AFF';
    ctx.fillRect(0, top0, W, Math.max(2, Math.round(nf * 0.2)));

    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';

    var titleY = top0 + Math.round(nf * 2.2);
    ctx.fillStyle = '#007AFF';
    ctx.font = '600 ' + Math.round(nf * 1.1) + 'px ' + CANVAS_FONT;
    ctx.fillText('修改意见 · 共 ' + rows.length + ' 条', padX, titleY);

    ctx.fillStyle = '#8E8E93';
    ctx.font = '400 ' + Math.round(nf * 0.84) + 'px ' + CANVAS_FONT;
    var who = annotatorName();
    var stamp = (who ? '批注人：' + who + ' · ' : '') + 'QQ 推送批改助手 · ' + fmtDate(Date.now());
    ctx.fillText(stamp, Math.max(padX, W - padX - ctx.measureText(stamp).width), titleY);

    ctx.strokeStyle = '#E5E5EA';
    ctx.lineWidth = Math.max(1, Math.round(nf * 0.08));
    ctx.beginPath();
    ctx.moveTo(padX, titleY + Math.round(nf * 1.15));
    ctx.lineTo(W - padX, titleY + Math.round(nf * 1.15));
    ctx.stroke();

    var cy = titleY + Math.round(nf * 2.2);

    rows.forEach(function (r) {
      var a = r.a;
      var t = TYPE_MAP[a.type] || TYPE_MAP.general;
      var midY = cy + Math.round(nf * 0.62);

      ctx.beginPath();
      ctx.arc(padX + badgeR, midY, badgeR, 0, Math.PI * 2);
      ctx.fillStyle = t.dot;
      ctx.fill();

      ctx.fillStyle = '#FFFFFF';
      ctx.font = '700 ' + Math.round(nf * 0.92) + 'px ' + CANVAS_FONT;
      ctx.textAlign = 'center';
      ctx.fillText(String(a._n), padX + badgeR, midY + Math.round(nf * 0.33));
      ctx.textAlign = 'left';

      ctx.fillStyle = t.dot;
      ctx.font = '600 ' + Math.round(nf * 0.94) + 'px ' + CANVAS_FONT;
      ctx.fillText(t.label, textX, cy + Math.round(nf * 1.0));
      var lw = ctx.measureText(t.label).width;
      ctx.fillStyle = '#8E8E93';
      ctx.font = '400 ' + Math.round(nf * 0.84) + 'px ' + CANVAS_FONT;
      ctx.fillText('· ' + locOf(a), textX + lw + Math.round(nf * 0.4), cy + Math.round(nf * 1.0));

      var lastBase = r.lines.length
        ? cy + Math.round(nf * 2.4) + (r.lines.length - 1) * lh
        : cy + Math.round(nf * 1.0);

      if (r.lines.length) {
        var by = cy + Math.round(nf * 2.4);
        ctx.fillStyle = '#1C1C1E';
        ctx.font = '400 ' + nf + 'px ' + CANVAS_FONT;
        r.lines.forEach(function (ln) { ctx.fillText(ln, textX, by); by += lh; });
      }

      if (r.sug.length) {
        var boxTop = lastBase + Math.round(nf * 0.5);
        var boxH = (r.sug.length - 1) * lh + Math.round(nf * 1.62);
        roundRectPath(ctx, textX, boxTop, W - textX - padX, boxH, innerRadius(cardRadius(nf)));
        ctx.fillStyle = 'rgba(52,199,89,.13)';
        ctx.fill();
        ctx.fillStyle = '#1B7A34';
        ctx.font = '400 ' + Math.round(nf * 0.95) + 'px ' + CANVAS_FONT;
        var sy = boxTop + Math.round(nf * 1.12);
        r.sug.forEach(function (ln) {
          ctx.fillText(ln, textX + Math.round(nf * 0.6), sy);
          sy += lh;
        });
      }
      cy += r.h;
    });
  }

  function triggerDownload(url, filename) {
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  function canvasToBlob(canvas, filename) {
    var saveUrl = function (url, revoke) {
      triggerDownload(url, filename);
      if (revoke) setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      toast('已下载 ' + filename);
    };
    if (!canvas.toBlob) { saveUrl(canvas.toDataURL('image/png'), false); return; }
    canvas.toBlob(function (blob) {
      if (!blob) { saveUrl(canvas.toDataURL('image/png'), false); return; }
      saveUrl(URL.createObjectURL(blob), true);
    }, 'image/png');
  }

  function exportImageDoc(withNotes) {
    if (!STATE.doc || !STATE.doc.image) { toast('还没有图片'); return; }
    toast('正在生成长图…');
    buildDocCanvas(withNotes).then(function (canvas) {
      canvasToBlob(canvas, safeName() + (withNotes ? '_批改长图.png' : '_标注图.png'));
    }).catch(function () {
      toast('图片生成失败，请重试');
    });
  }

  function exportImageDocPDF() {
    if (!STATE.doc || !STATE.doc.image) { toast('还没有图片'); return; }
    var w = window.open('', '_blank');
    if (!w) { toast('浏览器拦截了新窗口，请允许弹窗后重试'); return; }
    toast('正在准备 PDF…');
    buildDocCanvas(true).then(function (canvas) {
      var url = canvas.toDataURL('image/jpeg', 0.92);
      w.document.open();
      w.document.write(
        '<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">' +
        '<title>' + escapeHTML(STATE.doc.title || '批改稿') + '</title>' +
        '<style>@page{size:auto;margin:8mm;}html,body{margin:0;padding:0;}' +
        'img{display:block;width:100%;height:auto;}' +
        '.ft{font:11px/1.7 sans-serif;color:#8E8E93;text-align:center;margin:6px 0 0;}</style>' +
        '</head><body><img src="' + url + '">' +
        '<div class="ft">' + (annotatorName() ? '批注人：' + escapeHTML(annotatorName()) + ' · ' : '') +
          'QQ 推送批改助手 · ' + fmtDate(Date.now()) + '</div>' +
        '</body></html>'
      );
      w.document.close();
      setTimeout(function () { try { w.focus(); w.print(); } catch (e) {} }, 500);
    }).catch(function () {
      try { w.close(); } catch (e) {}
      toast('生成失败，请重试');
    });
  }

  /* ============================================================
   * 13.6 索引式长图（引线指向标注）
   *   两种摆法：
   *     side —— 意见卡排在图片左右两栏，引线从卡片牵到图上锚点（像标注图纸的引出线）；
   *     near —— 意见卡就贴在图形近旁（半透明底，尽量不糊住正文），短线指过去。
   *   卡片高度由 indexCardMetrics() 一个公式给出，量高度和画内容共用，
   *   与图下清单那套 noteRowHeight() 是同一个思路。
   * ============================================================ */
  function indexCols(cardW, nf) {
    var padX = Math.round(nf * 1.15);
    var badgeR = Math.round(nf * 0.68);
    var textX = padX + badgeR * 2 + Math.round(nf * 0.5);
    var innerW = Math.max(40, cardW - textX - padX);
    return { padX: padX, badgeR: badgeR, textX: textX, innerW: innerW };
  }

  function indexCardMetrics(nf, lh, nLines, nSug) {
    var padV = Math.round(nf * 0.95);
    var headBase = padV + Math.round(nf * 0.95);
    var bodyBase = padV + Math.round(nf * 2.4);
    var lastBody = nLines ? (bodyBase + (nLines - 1) * lh) : headBase;
    var sugTop = 0, sugBoxH = 0;
    if (nSug) { sugTop = lastBody + Math.round(nf * 0.62); sugBoxH = (nSug - 1) * lh + Math.round(nf * 1.66); }
    var bottom = (nSug ? sugTop + sugBoxH : lastBody) + Math.round(nf * 0.55);
    return { padV: padV, headBase: headBase, bodyBase: bodyBase, lastBody: lastBody,
             sugTop: sugTop, sugBoxH: sugBoxH, h: bottom + padV };
  }

  function buildIndexRows(notes, cardW, nf, lh, measure) {
    var cols = indexCols(cardW, nf);
    measure.font = '400 ' + nf + 'px ' + CANVAS_FONT;
    return notes.map(function (a) {
      var t = TYPE_MAP[a.type] || TYPE_MAP.general;
      var body = (a.body || '').trim();
      var lines = body ? wrapText(measure, body, cols.innerW) : [];
      var sug = (a.suggestion || '').trim() ? wrapText(measure, a.suggestion, cols.innerW) : [];
      var mm = indexCardMetrics(nf, lh, lines.length, sug.length);
      return { a: a, t: t, lines: lines, sug: sug, m: mm, h: mm.h, cols: cols };
    });
  }

  /* 圆角基准：卡片外圆角定死一个数，内层（色条、建议框）都由它按比例
     缩出来，成体系地「同心」——苹果的圆角是一层层往里收的，外大内小
     看着才整。之前外圆角 0.75nf、建议框 0.45nf 各拍各的，摆一起就散。 */
  function cardRadius(nf) { return Math.max(4, Math.round(nf * 0.58)); }
  function innerRadius(r) { return Math.max(3, Math.round(r * 0.55)); }

  function drawIndexCard(ctx, x, y, w, r, nf, lh, bgAlpha) {
    var m = r.m, cols = r.cols, t = r.t, a = r.a;
    var alpha = (bgAlpha == null) ? 1 : bgAlpha;
    var R = cardRadius(nf);

    ctx.globalAlpha = alpha;
    roundRectPath(ctx, x, y, w, r.h, R);
    ctx.fillStyle = '#FFFFFF';
    ctx.fill();
    ctx.strokeStyle = '#E5E5EA';
    ctx.lineWidth = Math.max(1, Math.round(nf * 0.1));
    ctx.stroke();
    ctx.globalAlpha = 1;

    /* 左侧类型色条：贴着卡片左边，圆角跟着外圆角收 */
    var railIn = Math.round(nf * 0.5);
    roundRectPath(ctx, x, y + railIn,
      Math.round(nf * 0.34), Math.max(4, r.h - railIn * 2),
      Math.max(2, Math.round(R * 0.72)));
    ctx.fillStyle = t.dot;
    ctx.fill();

    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';

    /* 编号徽标 */
    var bcx = x + cols.padX + cols.badgeR, bcy = y + m.padV + cols.badgeR;
    ctx.beginPath();
    ctx.arc(bcx, bcy, cols.badgeR, 0, Math.PI * 2);
    ctx.fillStyle = t.dot;
    ctx.fill();
    ctx.fillStyle = '#FFFFFF';
    ctx.font = '700 ' + Math.round(nf * 0.84) + 'px ' + CANVAS_FONT;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(a._n), bcx, bcy + Math.round(nf * 0.02));
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';

    /* 类型 + 位置描述 */
    var headY = y + m.headBase;
    ctx.fillStyle = t.dot;
    ctx.font = '600 ' + Math.round(nf * 0.86) + 'px ' + CANVAS_FONT;
    ctx.fillText(t.label, x + cols.textX, headY);
    var lw = ctx.measureText(t.label).width;
    ctx.fillStyle = '#8E8E93';
    ctx.font = '400 ' + Math.round(nf * 0.76) + 'px ' + CANVAS_FONT;
    ctx.fillText('· ' + locOf(a), x + cols.textX + lw + Math.round(nf * 0.35), headY);

    /* 意见正文 */
    if (r.lines.length) {
      var by = y + m.bodyBase;
      ctx.fillStyle = '#1C1C1E';
      ctx.font = '400 ' + nf + 'px ' + CANVAS_FONT;
      r.lines.forEach(function (ln) { ctx.fillText(ln, x + cols.textX, by); by += lh; });
    }

    /* 建议改法 */
    if (r.sug.length) {
      var bx = x + cols.textX, bTop = y + m.sugTop, bw = Math.max(20, w - cols.textX - cols.padX);
      roundRectPath(ctx, bx, bTop, bw, m.sugBoxH, innerRadius(R));
      ctx.fillStyle = 'rgba(52,199,89,.13)';
      ctx.fill();
      ctx.fillStyle = '#1B7A34';
      ctx.font = '400 ' + Math.round(nf * 0.92) + 'px ' + CANVAS_FONT;
      var sy = bTop + Math.round(nf * 1.1);
      r.sug.forEach(function (ln) { ctx.fillText(ln, bx + Math.round(nf * 0.55), sy); sy += lh; });
    }
  }

  /* 左右分栏的「分边」：先按锚点自然分边（锚点在图左半边就摆左栏），
     再把偏重那栏里最靠图心的几张挪到对面，挪到两栏张数、累计高度
     都大致相当为止。
     为什么必须挪：QQ 推送正文块几乎全长在图的左半边，纯按 x<0.5 分
     会分出 7:1 这种一头沉——左栏密密麻麻顶满，右栏只剩一条白边。
     只挪最少的张数、且优先挑锚点靠图心的，跨图的引线才最短也最少。 */
  function splitIndexSides(rows, gap) {
    var left = [], right = [];
    rows.forEach(function (r) { (r.relX < 0.5 ? left : right).push(r); });

    function sumH(list) {
      return list.reduce(function (s, r) { return s + r.h + gap; }, 0);
    }
    for (var guard = 0; guard <= rows.length + 2; guard++) {
      var heavy = sumH(left) >= sumH(right) ? left : right;
      var light = (heavy === left) ? right : left;
      var lopsided = (heavy.length - light.length > 1) ||
        (heavy.length > light.length && sumH(heavy) > sumH(light) * 1.35);
      if (!lopsided || heavy.length <= 1) break;

      var pick = 0;
      for (var i = 1; i < heavy.length; i++) {
        if (Math.abs(heavy[i].relX - 0.5) < Math.abs(heavy[pick].relX - 0.5)) pick = i;
      }
      light.push(heavy.splice(pick, 1)[0]);
    }
    return { left: left, right: right };
  }

  function layoutIndexSide(notes, W, H, nf, lh, measure) {
    var outerPad = Math.round(nf * 1.7);
    var gap = Math.round(nf * 1.5);
    var gutterW = Math.max(Math.round(nf * 11), Math.min(Math.round(W * 0.4), Math.round(nf * 19)));
    var cardW = Math.max(Math.round(nf * 6), gutterW - gap);
    var rows = buildIndexRows(notes, cardW, nf, lh, measure);

    var imgX = outerPad + gutterW;
    var imgY = outerPad;
    var canvasW = outerPad * 2 + gutterW * 2 + W;

    rows.forEach(function (r) {
      var an = anchorOf(r.a);
      r.relX = an.x; r.relY = an.y;
    });
    var sides = splitIndexSides(rows, gap);
    var left = sides.left, right = sides.right;

    function pack(list) {
      list.sort(function (p, q) { return p.relY - q.relY; });
      var y = imgY;
      list.forEach(function (r) {
        y = Math.max(y, imgY + r.relY * H - r.h / 2);
        r.y = y;
        y = r.y + r.h + gap;
      });
      return y;
    }
    var lb = pack(left), rb = pack(right);

    return {
      mode: 'side', canvasW: canvasW,
      canvasH: Math.max(imgY + H, lb, rb) + outerPad,
      imgX: imgX, imgY: imgY, W: W, H: H,
      left: left, right: right, cardW: cardW, gutterW: gutterW, gap: gap, outerPad: outerPad
    };
  }

  function drawIndexSide(ctx, plan, nf, lh) {
    var inset = Math.round(nf * 0.7);
    [['L', plan.left], ['R', plan.right]].forEach(function (pair) {
      var isLeft = pair[0] === 'L';
      pair[1].forEach(function (r) {
        var cx = isLeft ? plan.outerPad : (plan.imgX + plan.W + plan.gap);
        var ax = plan.imgX + r.relX * plan.W;
        var ay = plan.imgY + r.relY * plan.H;
        var edgeX = isLeft ? (cx + plan.cardW) : cx;
        /* 引线从卡片内边缘上「纵向最靠近锚点」的位置引出，而不是永远
           从垂直中点发出：锚点偏上就从偏上引出、偏下就从偏下引出。
           线短了，也不会所有引线都从同一处发散。 */
        var top = r.y + inset, bot = r.y + r.h - inset;
        var outY = (bot > top) ? Math.min(Math.max(ay, top), bot) : (r.y + r.h / 2);
        var bendX = isLeft
          ? (plan.imgX - Math.round(plan.gap * 0.3))
          : (plan.imgX + plan.W + Math.round(plan.gap * 0.3));

        ctx.strokeStyle = r.t.dot;
        ctx.lineWidth = Math.max(1, Math.round(nf * 0.11));
        ctx.globalAlpha = 0.7;
        ctx.beginPath();
        ctx.moveTo(edgeX, outY);
        ctx.lineTo(bendX, outY);
        ctx.lineTo(ax, ay);
        ctx.stroke();
        ctx.globalAlpha = 1;

        var dr = Math.max(2, Math.round(nf * 0.24));
        ctx.beginPath(); ctx.arc(ax, ay, dr, 0, Math.PI * 2);
        ctx.fillStyle = r.t.dot; ctx.fill();
        ctx.strokeStyle = '#FFFFFF';
        ctx.lineWidth = Math.max(1, Math.round(nf * 0.13));
        ctx.stroke();

        drawIndexCard(ctx, cx, r.y, plan.cardW, r, nf, lh, 1);
      });
    });
  }

  function layoutIndexNear(notes, W, H, nf, lh, measure) {
    var pad = Math.round(nf * 1.2);
    var cardW = Math.max(Math.round(nf * 10), Math.min(Math.round(W * 0.44), Math.round(nf * 17)));
    var rows = buildIndexRows(notes, cardW, nf, lh, measure);
    var imgY = pad;

    /* 卡片往「离图心远」的一侧摆，紧贴形状、尽量别压住正文；
       若因此探出图片边界，就把画布相应方向加宽，而不是把卡片裁掉。 */
    var leftExt = 0, rightExt = 0;
    rows.forEach(function (r) {
      var an = anchorOf(r.a);
      r.relX = an.x; r.relY = an.y;
      var toLeft = an.x < 0.5;
      var off = Math.round(nf * 1.1);
      r.rawCx = toLeft ? (an.x * W - off - cardW) : (an.x * W + off);
      r.toLeft = toLeft;
      leftExt = Math.max(leftExt, -r.rawCx);
      rightExt = Math.max(rightExt, (r.rawCx + cardW) - W);
    });
    leftExt = Math.max(0, Math.round(leftExt));
    rightExt = Math.max(0, Math.round(rightExt));

    var imgX = pad + leftExt;
    rows.forEach(function (r) { r.cx = imgX + r.rawCx; });

    rows.sort(function (p, q) { return p.relY - q.relY; });
    var y = imgY + Math.round(nf * 0.5);
    rows.forEach(function (r) {
      y = Math.max(y, imgY + r.relY * H - r.h / 2);
      r.y = y;
      y = r.y + r.h + Math.round(nf * 0.7);
    });

    return {
      mode: 'near', canvasW: pad * 2 + leftExt + rightExt + W,
      canvasH: Math.max(imgY + H, y + Math.round(nf * 0.6)) + pad,
      imgX: imgX, imgY: imgY, W: W, H: H, rows: rows, cardW: cardW
    };
  }

  function drawIndexNear(ctx, plan, nf, lh) {
    plan.rows.forEach(function (r) {
      var ax = plan.imgX + r.relX * plan.W;
      var ay = plan.imgY + r.relY * plan.H;
      var edgeX = r.toLeft ? (r.cx + plan.cardW) : r.cx;
      var edgeY = r.y + Math.min(r.h / 2, Math.round(nf * 1.8));

      ctx.strokeStyle = r.t.dot;
      ctx.lineWidth = Math.max(1, Math.round(nf * 0.12));
      ctx.globalAlpha = 0.85;
      ctx.beginPath();
      ctx.moveTo(edgeX, edgeY);
      ctx.lineTo(ax, ay);
      ctx.stroke();
      ctx.globalAlpha = 1;

      var dr = Math.max(2, Math.round(nf * 0.24));
      ctx.beginPath(); ctx.arc(ax, ay, dr, 0, Math.PI * 2);
      ctx.fillStyle = r.t.dot; ctx.fill();
      ctx.strokeStyle = '#FFFFFF';
      ctx.lineWidth = Math.max(1, Math.round(nf * 0.13));
      ctx.stroke();

      drawIndexCard(ctx, r.cx, r.y, plan.cardW, r, nf, lh, 0.95);
    });
  }

  function buildIndexCanvas(mode) {
    return new Promise(function (resolve, reject) {
      var doc = STATE.doc;
      if (!doc || !doc.image) { reject(new Error('no image')); return; }
      var W = doc.image.w, H = doc.image.h;
      var notes = exportAnnList(doc);
      var numMap = {};
      notes.forEach(function (a) { numMap[a.id] = a._n; });

      var f = Math.max(1, W / 760);
      var nf = Math.round(15 * f);
      var lh = Math.round(nf * 1.62);
      var measure = document.createElement('canvas').getContext('2d');

      var plan = (mode === 'near')
        ? layoutIndexNear(notes, W, H, nf, lh, measure)
        : layoutIndexSide(notes, W, H, nf, lh, measure);

      var canvas = document.createElement('canvas');
      /* 署名单独占一条底栏，不去挤卡片的排版空间 */
      var who = annotatorName();
      var footH = who ? Math.round(nf * 3.0) : 0;
      canvas.width = plan.canvasW;
      canvas.height = plan.canvasH + footH;
      var ctx = canvas.getContext('2d');
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      var photo = new Image();
      photo.onload = function () {
        ctx.drawImage(photo, plan.imgX, plan.imgY, W, H);
        var layer = buildMarksSVG(W, H, numMap);
        var str = new XMLSerializer().serializeToString(layer);
        var svgImg = new Image();
        var after = function () {
          if (mode === 'near') drawIndexNear(ctx, plan, nf, lh);
          else drawIndexSide(ctx, plan, nf, lh);
          if (footH) {
            var fy = plan.canvasH;
            ctx.textAlign = 'left';
            ctx.textBaseline = 'alphabetic';
            ctx.strokeStyle = '#E5E5EA';
            ctx.lineWidth = Math.max(1, Math.round(nf * 0.08));
            ctx.beginPath();
            ctx.moveTo(0, fy + 0.5);
            ctx.lineTo(canvas.width, fy + 0.5);
            ctx.stroke();
            ctx.fillStyle = '#8E8E93';
            ctx.font = '400 ' + Math.round(nf * 0.84) + 'px ' + CANVAS_FONT;
            ctx.fillText('批注人：' + who + ' · QQ 推送批改助手 · ' + fmtDate(Date.now()),
              Math.round(nf * 1.4), fy + Math.round(nf * 1.9));
          }
          resolve(canvas);
        };
        svgImg.onload = function () {
          ctx.drawImage(svgImg, plan.imgX, plan.imgY, W, H);
          after();
        };
        svgImg.onerror = after;
        svgImg.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(str);
      };
      photo.onerror = function () { reject(new Error('photo load fail')); };
      photo.src = doc.image.dataUrl;
    });
  }

  function exportImageDocIndex(mode) {
    if (!STATE.doc || !STATE.doc.image) { toast('还没有图片'); return; }
    if (!imageNoteMarks().length) {
      toast('还没有写了意见的标注；只有图形的话，用「长图 · 仅标注图形」');
      return;
    }
    toast('正在生成索引式长图…');
    buildIndexCanvas(mode).then(function (canvas) {
      canvasToBlob(canvas, safeName() + (mode === 'near' ? '_就近索引图.png' : '_两侧索引图.png'));
    }).catch(function () {
      toast('图片生成失败，请重试');
    });
  }

  function exportJSON() {
    var payload = {
      type: 'qq-push-reviewer',
      schemaVersion: 1,
      exportedAt: Date.now(),
      doc: STATE.doc
    };
    download(safeName() + '_存档.json', JSON.stringify(payload, null, 2), 'application/json');
    toast('存档已下载，可用于备份或换设备继续改');
  }

  /* ---------- 导入 JSON 存档 ----------
   * 导出的 payload 是 { type, schemaVersion, exportedAt, doc }。
   * 为了容错，这里也认「裸 doc 对象」和「docs 数组 / 顶层数组」两种写法，
   * 免得用户手改文件、或把多份拼在一起之后就导不进来。
   * 导入是明确的用户动作，所以直接落盘进列表，不用再点一次保存；
   * 同 id 冲突时先问「覆盖 / 另存副本」，不存在悄悄盖掉的可能。 */
  function pickImportJSON() {
    var inp = $('#jsonFile');
    if (inp) { inp.value = ''; inp.click(); }
  }

  function readImportJSON(file) {
    if (!file) return;
    var rd = new FileReader();
    rd.onload = function () {
      var payload;
      try { payload = JSON.parse(String(rd.result)); }
      catch (e) { toast('这个文件不是有效的 JSON'); return; }
      var list = importDocsFrom(payload);
      if (!list.length) { toast('没找到可导入的批改存档'); return; }
      adoptImported(list[0], list.length - 1);
    };
    rd.onerror = function () { toast('文件读取失败'); };
    rd.readAsText(file, 'utf-8');
  }

  function importDocsFrom(payload) {
    var raw;
    if (Array.isArray(payload)) raw = payload;
    else if (payload && Array.isArray(payload.docs)) raw = payload.docs;
    else if (payload && payload.doc) raw = [payload.doc];
    else if (payload && payload.kind) raw = [payload];
    else return [];

    var out = [];
    raw.forEach(function (d) {
      if (!d || typeof d !== 'object') return;
      if (d.type && d.type !== 'qq-push-reviewer') return;
      /* 完全不像文档的（既没 kind 也没任何批注/正文/图片）直接跳过 */
      if (d.kind !== 'text' && d.kind !== 'image' &&
          !d.annotations && !d.marks && !d.raw && !d.image) return;

      var c = JSON.parse(JSON.stringify(d));   /* 断开与原对象的引用 */
      delete c.type; delete c.schemaVersion; delete c.exportedAt;
      normalizeDoc(c);
      if (!c.id) c.id = uid('doc_');
      if (!c.title) c.title = c.kind === 'image' ? '未命名图片批改' : '未命名推送';
      c.createdAt = c.createdAt || Date.now();
      c.updatedAt = c.updatedAt || Date.now();
      if (c.kind === 'image') { c.marks = c.marks || []; c.raw = c.raw || ''; }
      c.schemaVersion = c.schemaVersion || 1;
      out.push(c);
    });
    return out;
  }

  /* 导入后的收尾：设为当前文档并直接落盘。
     extra 是「同一份文件里还有几份没导」——一份存档文件只带一个文档，
     多出来的只能提示一下，别装作导入成功了。 */
  function adoptImported(d, extra) {
    guardUnsaved(function () {
      var proceed = function (doc) {
        STATE.doc = doc;
        STATE.focusAnnId = null;
        $('#docTitle').value = doc.title;
        STATE.mode = defaultModeFor(doc);
        if (STATE.mode === 'edit' && doc.kind === 'text') $('#editor').value = doc.raw || '';
        hideImgComposer();
        renderAll();
        if (saveNow(true)) {
          toast('已导入「' + doc.title + '」' + (extra > 0 ? '，另有 ' + extra + ' 份未导入' : ''));
        } else {
          setDirty(true);   /* 落盘失败（多半是空间不足），至少别让它看着像已存 */
        }
        if (isNarrow()) setMView('main');
      };

      if (!isIndexed(d.id)) { proceed(d); return; }
      ask({
        title: '列表里已有这份存档',
        msg: '「' + (d.title || '未命名') + '」和列表里某一份的 id 相同。要覆盖它，还是另存为一份副本？',
        actions: [
          { label: '覆盖', value: 'over', kind: 'destructive' },
          { label: '另存副本', value: 'copy', kind: 'primary' },
          { label: '取消', value: 'cancel', kind: 'ghost' }
        ]
      }).then(function (r) {
        if (r.act === 'over') { proceed(d); return; }
        if (r.act === 'copy') {
          d.id = uid('doc_');
          d.title = d.title + ' 副本';
          proceed(d);
        }
      });
    });
  }

  function copyPlainText() {
    var isImg = STATE.doc && STATE.doc.kind === 'image';
    var anns = exportAnnList(STATE.doc);
    if (!anns.length) { toast('还没有批注'); return; }
    var lines = ['【' + (STATE.doc.title || '推送') + '】修改意见', ''];
    anns.forEach(function (a) {
      var t = TYPE_MAP[a.type] || TYPE_MAP.general;
      lines.push(a._n + '. [' + t.label + ']' +
        (isImg ? '（' + locOf(a) + '）' : '') + ' ' + (a.body || ''));
      if (a.suggestion) lines.push('   建议改为：' + a.suggestion);
    });
    var text = lines.join('\n');
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast('意见已复制，可直接粘回 QQ'); },
        function () { fallbackCopy(text); });
    } else {
      fallbackCopy(text);
    }
  }

  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;left:-9999px;';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); toast('意见已复制'); }
    catch (e) { toast('复制失败，请手动选择'); }
    document.body.removeChild(ta);
  }

  /* ============================================================
   * 14. 粘贴增强 —— 从 QQ 复制时尽量还原表情
   * ============================================================ */
  function recoverEmojiFromHTML(html) {
    if (!html) return null;
    var out = html;
    var found = false;

    out = out.replace(/<img\b[^>]*>/gi, function (tag) {
      var attr = /(?:alt|title)\s*=\s*["']([^"']*)["']/i.exec(tag);
      var src = /src\s*=\s*["']([^"']*)["']/i.exec(tag);
      var codeM = src && /[=/]e(\d{1,4})(?:[."'&]|$)/i.exec(src[1]);
      if (codeM && EMOJI_BY_CODE['e' + codeM[1]]) {
        found = true;
        return '[' + QQ_NAMES[Number(codeM[1]) - 100] + ']';
      }
      if (attr && attr[1]) {
        var v = attr[1].trim();
        var m = /\[([^\]]{1,8})\]/.exec(v) || /\/([\u4e00-\u9fa5A-Za-z]{1,6})/.exec(v);
        var name = m ? (m[1] || '') : v;
        if (EMOJI_BY_NAME[name]) { found = true; return '[' + name + ']'; }
        if (v && v.length <= 4 && /\p{Emoji_Presentation}/u.test(v)) { found = true; return v; }
      }
      return '';
    });

    out = out.replace(/<br\s*\/?>/gi, '\n');
    out = out.replace(/<\/(p|div|li|tr|h[1-6])>/gi, '\n');
    out = out.replace(/<[^>]+>/g, '');
    out = out.replace(/&nbsp;/g, ' ').replace(/&lt;/g, '<').replace(/&gt;/g, '>')
      .replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, '&');
    out = out.replace(/\n{3,}/g, '\n\n').trim();

    return found && out ? out : null;
  }

  /* ============================================================
   * 15. 事件绑定
   * ============================================================ */
  function bindEvents() {
    /* 模式 */
    $$('.tab').forEach(function (t) {
      t.addEventListener('click', function () { switchMode(t.dataset.mode); });
    });

    /* 标题：只改内存，不写盘也不动列表 —— 列表反映的是「已保存」的状态 */
    $('#docTitle').addEventListener('input', function () {
      STATE.doc.title = this.value || '未命名推送';
      touch();
    });

    /* 编辑区 */
    var editor = $('#editor');
    editor.addEventListener('input', function () {
      STATE.doc.raw = this.value;
      markDirty();
    });
    editor.addEventListener('paste', function (e) {
      var cd = e.clipboardData;
      if (!cd) return;
      var html = '';
      try { html = cd.getData('text/html') || ''; } catch (err) {}
      var text = '';
      try { text = cd.getData('text/plain') || ''; } catch (err) {}
      var recovered = recoverEmojiFromHTML(html);
      var use = recovered || text;
      if (!use) return;
      e.preventDefault();
      var start = this.selectionStart, end = this.selectionEnd;
      this.value = this.value.slice(0, start) + use + this.value.slice(end);
      this.selectionStart = this.selectionEnd = start + use.length;
      STATE.doc.raw = this.value;
      markDirty();
      if (recovered) toast('已从剪贴板还原图片表情');
    });

    /* 新建 / 文档列表 */
    $('#btnNew').addEventListener('click', createDoc);
    $('#btnNewImg').addEventListener('click', createImageDoc);

    /* 保存 */
    $('#btnSave').addEventListener('click', function () { saveNow(false); });

    /* 筛选 */
    $('#filterSel').addEventListener('change', function () {
      STATE.filter = this.value;
      renderSidebar();
    });

    /* 导出菜单 */
    var menu = $('#exportMenu');
    $('#btnExport').addEventListener('click', function (e) {
      e.stopPropagation();
      var willOpen = menu.classList.contains('hidden');
      hidePops();
      if (willOpen) {
        renderExportMenu();
        menu.classList.remove('hidden');
      }
    });
    document.addEventListener('click', hidePops);
    menu.addEventListener('click', function (e) {
      var btn = e.target.closest ? e.target.closest('[data-act]') : null;
      if (!btn) return;
      var act = btn.dataset.act;
      menu.classList.add('hidden');
      if (act === 'html-list') exportHTML('list');
      else if (act === 'html-inline') exportHTML('inline');
      else if (act === 'pdf-list') exportPDF('list');
      else if (act === 'pdf-inline') exportPDF('inline');
      else if (act === 'img-list') exportImage('list');
      else if (act === 'img-inline') exportImage('inline');
      else if (act === 'imgdoc-list') exportImageDoc(true);
      else if (act === 'imgdoc-only') exportImageDoc(false);
      else if (act === 'imgdoc-side') exportImageDocIndex('side');
      else if (act === 'imgdoc-near') exportImageDocIndex('near');
      else if (act === 'imgdoc-pdf') exportImageDocPDF();
      else if (act === 'json') exportJSON();
      else if (act === 'json-import') pickImportJSON();
      else if (act === 'text') copyPlainText();
    });

    /* ---------- 主题 ---------- */
    $('#btnTheme').addEventListener('click', toggleTheme);

    /* ---------- 导入 JSON 存档 ---------- */
    $('#jsonFile').addEventListener('change', function () {
      readImportJSON(this.files && this.files[0]);
    });

    /* ---------- 批注人 ---------- */
    var whoPop = $('#whoPop');
    $('#btnWho').addEventListener('click', function (e) {
      e.stopPropagation();
      var willOpen = whoPop.classList.contains('hidden');
      hidePops();
      if (!willOpen) return;
      whoPop.classList.remove('hidden');
      renderWho();
      setTimeout(function () {
        var inp = $('#whoInput');
        if (inp) { inp.focus(); inp.select(); }
      }, 0);
    });
    whoPop.addEventListener('click', function (e) { e.stopPropagation(); });
    $('#whoInput').addEventListener('input', function () {
      var ini = annotatorInitials(this.value);
      $('#whoAvatarBig').textContent = ini;
      $('#whoAvatar').textContent = ini;
    });
    $('#whoInput').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); setAnnotator(this.value); whoPop.classList.add('hidden'); }
      else if (e.key === 'Escape') { e.stopPropagation(); whoPop.classList.add('hidden'); renderWho(); }
    });
    $('#whoSave').addEventListener('click', function () {
      setAnnotator($('#whoInput').value);
      whoPop.classList.add('hidden');
    });
    $('#whoClear').addEventListener('click', function () {
      setAnnotator('');
      whoPop.classList.add('hidden');
    });

    /* ---------- 窄屏底部导航 ---------- */
    $$('.mnav button').forEach(function (b) {
      b.addEventListener('click', function () { setMView(b.dataset.mview); });
    });

    /* ---------- 图片批改 ---------- */
    $('#btnPickImg').addEventListener('click', function () { $('#imgFile').click(); });
    $('#imgFile').addEventListener('change', function () {
      var f = this.files && this.files[0];
      this.value = '';
      if (f) importImage(f);
    });

    $('#imgTools').addEventListener('click', onImgToolClick);
    $('#imgTools').addEventListener('change', function (e) {
      if (!e.target || e.target.id !== 'imgZoom') return;
      var v = e.target.value;
      DRAW.zoom = v === 'fit' ? 'fit' : parseFloat(v);
      fitHolder();
    });
    $('#imgTools').addEventListener('input', function (e) {
      if (!e.target || e.target.id !== 'imgColor') return;
      DRAW.color = e.target.value;
      $$('#imgTools .sw').forEach(function (s) { s.classList.remove('is-on'); });
    });

    $('#stageSvg').addEventListener('pointerdown', onImgPointerDown);
    $('#stageSvg').addEventListener('pointermove', onImgPointerMove);
    $('#stageSvg').addEventListener('pointerup', onImgPointerUp);
    $('#stageSvg').addEventListener('pointercancel', onImgPointerUp);

    /* 拖拽图片进来 */
    var board = $('#imgBoard');
    ['dragenter', 'dragover'].forEach(function (ev) {
      board.addEventListener(ev, function (e) {
        if (!STATE.doc || STATE.doc.kind !== 'image') return;
        e.preventDefault();
        $('#imgDrop').classList.add('is-over');
      });
    });
    ['dragleave', 'dragend'].forEach(function (ev) {
      board.addEventListener(ev, function () { $('#imgDrop').classList.remove('is-over'); });
    });
    board.addEventListener('drop', function (e) {
      if (!STATE.doc || STATE.doc.kind !== 'image') return;
      e.preventDefault();
      $('#imgDrop').classList.remove('is-over');
      var dt = e.dataTransfer;
      var f = dt && dt.files && dt.files[0];
      if (f && /^image\//.test(f.type)) importImage(f);
    });

    /* 截图后直接 Ctrl + V —— 这是最顺手的入口 */
    document.addEventListener('paste', function (e) {
      var f = imageFromClipboard(e.clipboardData);
      if (!f) return;
      e.preventDefault();
      importImage(f);
    });

    /* 意见框：点别处收起。有没保存的字就先提醒，绝不静默丢意见 */
    document.addEventListener('mousedown', function (e) {
      var box = $('#imgComposer');
      if (!box || box.classList.contains('hidden')) return;
      if (box.contains(e.target)) return;
      if (e.target.closest && e.target.closest('#imgStage')) return;
      if (imgComposerDirty()) { toast('先把意见保存，或按 Esc 取消'); return; }
      hideImgComposer();
    });

    window.addEventListener('resize', function () {
      if (STATE.doc && STATE.doc.kind === 'image') fitHolder();
    });

    /* 点击空白收起浮动条 */
    $('#canvasWrap').addEventListener('mousedown', function (e) {
      var bar = $('#floatingBar');
      if (!bar.classList.contains('hidden') && !bar.contains(e.target)) {
        var sel = window.getSelection();
        if (!sel || sel.isCollapsed) hideFloating();
      }
    });

    /* 快捷键 */
    document.addEventListener('keydown', function (e) {
      /* 弹窗开着的时候，键盘交给弹窗自己处理 */
      if (dialogOpen()) return;

      var mod = e.ctrlKey || e.metaKey;
      var inField = document.activeElement &&
        /INPUT|TEXTAREA/.test(document.activeElement.tagName);

      if (e.key === 'Escape') {
        hideFloating();
        hideImgComposer();
        relocateTarget = null;
        return;
      }

      if (mod && e.key.toLowerCase() === 's') {
        e.preventDefault();
        if (STATE.dirty) saveNow(false);
        else toast('没有需要保存的改动');
        return;
      }

      if (STATE.mode !== 'annotate') return;

      /* 图片批改：Ctrl+Z 撤销上一步绘制 */
      if (mod && e.key.toLowerCase() === 'z' && STATE.doc.kind === 'image') {
        if (inField) return;
        e.preventDefault();
        undoMark();
        return;
      }

      if (e.key === 'j' || e.key === 'k') {
        if (inField) return;
        var anns = exportAnnList(STATE.doc);
        if (!anns.length) return;
        var idx = -1;
        anns.forEach(function (a, i) { if (a.id === STATE.focusAnnId) idx = i; });
        idx = e.key === 'j' ? idx + 1 : idx - 1;
        if (idx < 0) idx = anns.length - 1;
        if (idx >= anns.length) idx = 0;
        e.preventDefault();
        focusAnnotation(anns[idx].id);
      }
    });

    /* 选区监听 + 正文点击定位 */
    document.addEventListener('selectionchange', onSelectChange);
    document.addEventListener('click', onBodyClick);

    /* 带着未保存的改动关页面 / 刷新：交给浏览器弹原生确认。
       这里只能用同步的原生提示——自绘弹窗在 beforeunload 里来不及画。 */
    window.addEventListener('beforeunload', function (e) {
      if (!STATE.doc || !STATE.dirty) return;
      e.preventDefault();
      e.returnValue = '';
      return '';
    });
  }

  /* ============================================================
   * 16. 启动
   * ============================================================ */
  /* 全新打开时的默认文档：图片批改。
     图片批改是本工具的主推方式 —— 截图就是"发出去长什么样"的权威版本，
     不需要跟表情渲染较劲。文字批注仍然保留，点左栏「文字推送」即可。 */
  function defaultDraft() {
    return newImageDoc('未命名图片批改');
  }

  function boot() {
    var list = store.index();

    loadSettings();
    applyTheme(SETTINGS.theme, false);
    renderWho();

    if (list.length) STATE.doc = normalizeDoc(store.doc(list[0].id));

    /* 全新打开（或索引里的文档读不出来）：落到默认草稿。
       注意草稿只活在内存里 —— 不写盘、不进文档列表，
       等用户真正点「保存」时才落盘并出现在列表里。
       这样「刚打开是干净的」和「点保存才保存」是同一条规则。 */
    if (!STATE.doc) STATE.doc = defaultDraft();

    $('#docTitle').value = STATE.doc.title;
    STATE.mode = defaultModeFor(STATE.doc);

    bindEvents();
    renderAll();
    setDirty(false);
    setMView('main');
  }

  /* Node 环境下只导出纯逻辑，供 src/_lexer-check.js 做单元验证；
     浏览器里没有 module，正常启动。 */
  if (typeof module !== 'undefined' && module.exports) {
    module.exports = {
      lex: lex,
      snapToToken: snapToToken,
      buildRenderPlan: buildRenderPlan,
      recoverEmojiFromHTML: recoverEmojiFromHTML,
      QQ_NAMES: QQ_NAMES,
      EMOJI_BY_NAME: EMOJI_BY_NAME
    };
    return;
  }

  /* 调试出口：方便在浏览器控制台里检查内部状态，也供自动化测试调用。
     纯本地工具，暴露这些不影响任何行为。 */
  window.__QPR__ = {
    lex: lex,
    snapToToken: snapToToken,
    buildRenderPlan: buildRenderPlan,
    boundaryOffset: boundaryOffset,
    readSelection: readSelection,
    renderBody: renderBody,
    renderBodyUI: renderBody_,
    renderDocList: renderDocList,
    renderSidebar: renderSidebar,
    switchMode: switchMode,
    showFloating: showFloating,
    hideFloating: hideFloating,
    addAnnotation: addAnnotation,
    buildExportHTML: buildExportHTML,
    recoverEmojiFromHTML: recoverEmojiFromHTML,
    STATE: STATE,
    store: store,

    /* 保存模型与弹窗 */
    saveNow: saveNow,
    setDirty: setDirty,
    markDirty: markDirty,
    guardUnsaved: guardUnsaved,
    ask: ask,
    dialogOpen: dialogOpen,
    renderSaveBtn: renderSaveBtn,
    renderDocListUI: renderDocList,
    createDoc: createDoc,
    createImageDoc: createImageDoc,
    defaultDraft: defaultDraft,
    startDraft: startDraft,
    openDoc: openDoc,
    exportJSON: exportJSON,
    importDocsFrom: importDocsFrom,
    adoptImported: adoptImported,
    readImportJSON: readImportJSON,
    deleteDoc: deleteDoc,
    isBlankDoc: isBlankDoc,
    canReuseDraft: canReuseDraft,
    isIndexed: isIndexed,

    /* 偏好设置：主题 / 批注人 / 窄屏视图 */
    SETTINGS: SETTINGS,
    loadSettings: loadSettings,
    applyTheme: applyTheme,
    toggleTheme: toggleTheme,
    renderWho: renderWho,
    setAnnotator: setAnnotator,
    annotatorName: annotatorName,
    annotatorInitials: annotatorInitials,
    setMView: setMView,
    isNarrow: isNarrow,
    ICONS: ICONS,

    /* 图片批改 */
    TYPE_MAP: TYPE_MAP,
    DRAW: DRAW,
    newImageDoc: newImageDoc,
    normalizeDoc: normalizeDoc,
    imageMarks: imageMarks,
    imageNoteMarks: imageNoteMarks,
    findMark: findMark,
    anchorOf: anchorOf,
    locOf: locOf,
    quoteOf: quoteOf,
    markNode: markNode,
    markFromStroke: markFromStroke,
    buildMarksSVG: buildMarksSVG,
    buildDocCanvas: buildDocCanvas,
    buildIndexCanvas: buildIndexCanvas,
    layoutIndexSide: layoutIndexSide,
    layoutIndexNear: layoutIndexNear,
    splitIndexSides: splitIndexSides,
    cardRadius: cardRadius,
    innerRadius: innerRadius,
    indexCardMetrics: indexCardMetrics,
    exportImageDocIndex: exportImageDocIndex,
    paintPreview: paintPreview,
    ptsAttr: ptsAttr,
    renderImgStage: renderImgStage,
    renderImgTools: renderImgTools,
    paintMarks: paintMarks,
    openImgComposer: openImgComposer,
    commitImgComposer: commitImgComposer,
    hideImgComposer: hideImgComposer,
    importImage: importImage,
    intakeImage: intakeImage,
    undoMark: undoMark,
    clearMarks: clearMarks,
    renderExportMenu: renderExportMenu
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }

})();

</script>
<script>window.addEventListener("load",function(){
(function () {
  var Q = window.__QPR__;

  /* 固定落到夹具文字稿上，避免上一轮残留在 localStorage 里的文档
     让示例批注全部挂空——那样导出结果会「看起来通过」，实际什么都没测到。 */
  Q.STATE.doc = Q.normalizeDoc({
